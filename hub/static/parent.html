<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EEFF">
<title>Whyscope | Parent</title>
<style>
  :root {
    --ink: #2B2A4A; --body: #5A5878; --cap: #6E6C8E;
    --lav: #C7B8FF; --lav-ink: #5B4AB8; --lav-d: #3B2F8F; --sky: #BFE0FF; --sky-ink: #2B6CB0; --sky-d: #1E4E80;
    --peach: #FFD6C2; --peach-ink: #C2410C; --peach-d: #9A3412; --mint: #CBF3E3; --mint-ink: #1F7A5C; --mint-d: #14604A;
    --lemon: #FFF1B8; --lemon-ink: #8A6D00; --lemon-d: #6B5400; --rose: #FFD1E0; --rose-ink: #B4306B; --rose-d: #8F2257;
    --red: #C62828;
    --glass: rgba(255,255,255,0.62); --glass-line: rgba(255,255,255,0.8); --shadow: 0 10px 30px rgba(96,80,140,0.10);
    --r: 28px; --btn: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { color: var(--ink); min-height: 100vh; position: relative; overflow-x: hidden;
         background: linear-gradient(160deg, #F6EEFF 0%, #FDE9F1 35%, #FFF2E6 70%, #E9F3FF 100%) fixed;
         font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; }
  .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .4; pointer-events: none; z-index: 0; }
  .blob.b1 { width: 320px; height: 320px; background: #CDB8FF; top: -100px; left: -110px; }
  .blob.b2 { width: 300px; height: 300px; background: #FFD3B6; bottom: -90px; right: -100px; }
  button { font: inherit; color: inherit; cursor: pointer; transition: transform .12s; }
  button:active:not(:disabled) { transform: scale(.96); }
  #app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding: 0 16px 128px; }
  .glass, .card, .li, .ev, .cheat, .tcard, div.seg, .dev, .lang, .icon-btn.g { background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
           border: 1px solid var(--glass-line); box-shadow: var(--shadow); }

  /* top bar */
  .top { display: flex; align-items: center; gap: 8px; padding: 16px 0 8px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--lav); display: grid; place-items: center; font-size: 22px; flex: none; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .top .who { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .who small { display: block; font-size: 12.5px; font-weight: 500; color: var(--body); }
  .dev { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--body); padding: 6px 10px; border-radius: 999px; }
  .dev i { width: 10px; height: 10px; border-radius: 50%; background: #A9A7C2; }
  .dev.ok i { background: #3DBE8B; }
  .icon-btn { width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; flex: none; padding: 0; background: var(--glass); }
  .icon-btn svg { width: 22px; height: 22px; }
  .lang { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--cap); flex: none; }
  .lang button { position: relative; border: 0; background: none; color: inherit; padding: 3px 9px; border-radius: 999px; min-width: 30px; }
  .lang button::after { content: ""; position: absolute; inset: -14px -2px; }
  .lang button[aria-pressed="true"] { background: var(--lav-ink); color: #fff; }
  .lang i { font-style: normal; opacity: .5; }
  @media (max-width: 430px) { .dev span { display: none; } .dev { padding: 10px; } }

  /* segmented */
  div.seg { display: flex; border-radius: 999px; padding: 4px; margin: 8px 0 16px; gap: 4px; }
  .seg button { flex: 1; min-height: 44px; border: 0; background: none; border-radius: 999px; font-weight: 700; color: var(--body); }
  .seg button[aria-pressed="true"] { background: var(--lav-ink); color: #fff; }

  /* cards & text */
  .card { border-radius: var(--r); padding: 22px 14px; margin-bottom: 16px; }
  h2 { font-size: 16px; font-weight: 700; margin: 22px 4px 11px; display: flex; align-items: center; gap: 8px; color: var(--ink); }
  h2 .n { margin-left: auto; font-size: 14.5px; font-weight: 700; color: var(--lav-d); background: var(--lav); border-radius: 999px; padding: 0 12px; }
  .hero { display: flex; align-items: flex-end; gap: 12px; padding: 0 8px; }
  .hero .big { font-size: 54px; font-weight: 800; line-height: .95; letter-spacing: -1px; }
  .hero .lbl { font-size: 12.5px; font-weight: 700; color: var(--body); padding-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 700; border: 0;
          background: rgba(255,255,255,.7); color: var(--ink); }
  .chip.up { background: var(--mint); color: var(--mint-d); } .chip.down { background: var(--peach); color: var(--peach-d); }
  .spark { width: 100%; height: 108px; display: block; margin-top: 16px; }
  .spark text { font-size: 12.5px; fill: #5A5878; }
  .row { display: flex; align-items: center; gap: 12px; }
  .wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .wrapchips .chip { background: var(--sky); color: var(--sky-d); font-size: 13px; }
  .talk-btn { min-height: 48px; border-radius: 999px; border: 0; background: var(--mint); color: var(--mint-d); font-weight: 700; padding: 0 20px; white-space: nowrap; }

  /* topic discs + donut */
  .discs { display: flex; justify-content: space-between; gap: 4px; margin-bottom: 24px; }
  .disc { flex: 1; min-width: 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; }
  .disc .d { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; }
  .disc b { font-size: 14px; font-weight: 800; color: var(--ink); line-height: 1.2; }
  .disc span.t { font-size: 12.5px; color: var(--body); line-height: 1.2; text-align: center; overflow-wrap: normal; }
  .donut { width: 132px; height: 132px; display: block; margin: 0 auto; }
  .donut circle.seg { cursor: pointer; transition: stroke-width .15s; }
  .donut circle.seg:hover, .donut circle.seg:focus { stroke-width: 4.8; outline: none; }

  /* swipe cards */
  .swipe { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 16px 16px; margin: 0 -16px; scrollbar-width: none; }
  .swipe::-webkit-scrollbar { display: none; }
  .tcard { scroll-snap-align: center; flex: 0 0 76%; border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
  .tcard .hd { height: 72px; display: flex; align-items: center; padding: 0 18px; }
  .tcard .em { font-size: 35px; line-height: 1; }
  .tcard .bd { padding: 14px 18px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .tcard .obj { font-size: 19px; font-weight: 700; line-height: 1.3; }
  .tcard .ask { font-size: 14.5px; color: var(--body); flex: 1; }
  .tcard .talk-btn { align-self: flex-end; margin-top: 8px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .li { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 24px; }
  .li .em { width: 44px; height: 44px; border-radius: 50%; background: var(--lemon); display: grid; place-items: center; font-size: 19px; flex: none; }
  .li .tx { flex: 1; min-width: 0; font-size: 14.5px; }

  /* empty */
  .empty { text-align: center; padding: 14px 8px; color: var(--body); }
  .empty .eb { width: 96px; height: 96px; border-radius: 50%; background: var(--lav); display: grid; place-items: center; font-size: 38px; margin: 0 auto 12px; }
  .empty p { margin: 0; font-size: 14.5px; }

  /* log */
  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters .chip { flex: none; min-height: 44px; font-size: 14px; padding: 0 14px; border: 1px solid var(--glass-line); }
  .filters .chip[aria-pressed="true"] { background: var(--lav-ink); color: #fff; }
  .day { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--lav-d); background: var(--lav); border-radius: 999px; padding: 2px 14px; margin: 16px 0 8px; }
  .ev { border-radius: 24px; }
  button.ev { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px 14px; text-align: left; }
  .ev .em { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; flex: none; }
  .ev .nm { flex: 1; font-size: 14.5px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .st { font-size: 18px; flex: none; }
  .ev .tm { font-size: 12.5px; color: var(--body); flex: none; min-width: 48px; text-align: right; }
  .tl { display: flex; flex-direction: column; gap: 12px; }

  /* cheats */
  .cheat { border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
  .cheat .hd { display: flex; align-items: center; gap: 12px; padding: 11px 14px; font-weight: 800; font-size: 16px; }
  .cheat .hd .em { font-size: 24px; }
  .cheat .hd .when { margin-left: auto; font-size: 12.5px; font-weight: 600; }
  .cheat .bd { padding: 14px; }
  .cheat .said { font-size: 14.5px; color: var(--body); margin: 0 0 12px; }
  .cheat ul { margin: 0 0 12px; padding-left: 20px; } .cheat li { margin-bottom: 8px; font-size: 14.5px; }
  .nosay { background: rgba(236,232,248,.85); color: #4A4868; border-radius: 20px; padding: 11px 14px; margin-bottom: 12px; font-size: 14.5px; }
  .nosay b { display: block; margin-bottom: 2px; }
  .nosay ul { margin: 0; padding-left: 20px; } .nosay li { font-size: 14.5px; margin: 2px 0; }
  .srcs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .srcs a { font-size: 12.5px; font-weight: 600; color: var(--sky-d); background: var(--sky); border-radius: 999px; padding: 6px 13px; text-decoration: none; min-height: 36px; display: inline-flex; align-items: center; }
  .cheat.urgent { border: 2px solid var(--red); } .cheat.urgent .bd { background: rgba(255,209,224,.38); }
  .tel { display: flex; gap: 12px; margin-bottom: 12px; }
  .tel a { flex: 1; min-height: 64px; border-radius: 999px; background: var(--rose); color: var(--rose-d); font-weight: 800; font-size: 17.5px; text-decoration: none; display: grid; place-items: center; text-align: center; line-height: 1.15; }
  .tel a small { display: block; font-size: 12.5px; font-weight: 600; }
  .okbtn { width: 100%; min-height: 52px; border-radius: 999px; border: 0; background: var(--mint); color: var(--mint-d); font-weight: 800; }
  .okbtn[disabled] { background: rgba(255,255,255,.7); color: var(--mint-d); cursor: default; }

  /* kid tab */
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tg { min-height: 64px; border-radius: 999px; border: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 14.5px; font-weight: 700; text-align: left;
        background: var(--pa, var(--lav)); color: var(--pd, var(--lav-d)); }
  .tg .em { font-size: 21px; }
  .tg[aria-pressed="true"] { background: var(--pi, var(--lav-ink)); color: #fff; }
  .ages { display: flex; justify-content: space-between; gap: 8px; }
  .ages button { width: 72px; height: 72px; flex: none; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass); font-size: 24px; font-weight: 800; color: var(--ink); }
  .ages button[aria-pressed="true"] { background: var(--lav-ink); color: #fff; border-color: var(--lav-ink); }
  input.txt { width: 100%; min-height: 56px; border-radius: 28px; border: 1px solid var(--glass-line); padding: 0 22px; font: inherit; font-size: 14.5px; background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: var(--ink); box-shadow: var(--shadow); }
  input.txt::placeholder { color: var(--cap); }
  input.txt:focus { outline: none; border-color: var(--lav-ink); }
  .note { color: var(--body); font-size: 12.5px; margin: 12px 4px 0; }
  .recent { font-size: 14px; background: var(--lemon); color: var(--lemon-d); border-radius: 999px; padding: 6px 14px; font-weight: 600; }

  /* avatars */
  .avs { display: flex; gap: 12px; }
  .avs button { width: 72px; height: 72px; flex: none; padding: 0; border-radius: 50%; border: 3px solid var(--glass-line); background: var(--lav); overflow: hidden; display: grid; place-items: center; font-size: 30px; }
  .avs button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avs button[aria-pressed="true"] { border-color: var(--lav-ink); box-shadow: 0 0 0 3px var(--lav); }
  .chars { display: block; width: 320px; max-width: 100%; height: auto; margin: 0 auto 8px; }
  .empty .btn { margin-top: 14px; }

  /* snapshots: polaroid cards */
  .pol { position: relative; margin: 0; padding: 8px 8px 12px; background: #fff; border-radius: 6px; box-shadow: 0 8px 22px rgba(96,80,140,.20), 0 1px 3px rgba(96,80,140,.12); }
  .pol .ph { position: relative; border-radius: 3px; overflow: hidden; background: #EDE8F8; line-height: 0; }
  .pol .ph img { width: 100%; height: auto; display: block; filter: sepia(.18) saturate(1.08) contrast(1.03) brightness(1.02); }
  .pol .ph::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 3px;
                    box-shadow: inset 0 0 0 6px rgba(255,255,255,.55), inset 0 0 34px rgba(70,45,20,.30); background: rgba(255,196,130,.07); }
  .pol .cap { font-style: italic; font-weight: 600; color: var(--ink); font-size: 14px; line-height: 1.3; margin-top: 10px; padding: 0 2px;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .pol .dt { font-size: 12.5px; color: var(--cap); padding: 0 2px; margin-top: 2px; }
  .tl button.pol { width: min(100%, 300px); align-self: center; margin: 4px 0; }
  button.pol { border: 0; text-align: left; display: block; transform: rotate(var(--rot, 0deg)); transition: transform .15s; }
  button.pol:active:not(:disabled) { transform: rotate(var(--rot, 0deg)) scale(.97); }
  #polwrap { position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(43,42,74,.5);
             -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); overflow-y: auto; }
  #polwrap.open { display: flex; }
  .polcard { position: relative; width: 100%; max-width: 340px; margin: auto; }
  .polcard .pol { padding: 12px 12px 16px; transform: rotate(var(--rot, 0deg)); }
  .polcard .pol .cap { font-size: 17px; -webkit-line-clamp: 4; }
  .polcard .ans { font-size: 14.5px; color: var(--body); margin: 10px 2px 0; padding-top: 10px; border-top: 1px dashed #DDD6F0; }
  .polcard .ans.b { margin-top: 6px; padding-top: 0; border-top: 0; color: var(--peach-d); font-weight: 600; }
  .pol .nph { display: flex; align-items: center; justify-content: center; padding: 14px 0 4px; }
  .pol .nph .em { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; }
  .polcard .acts { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .polx { position: absolute; top: -14px; right: -6px; z-index: 2; background: #fff; box-shadow: var(--shadow); }
  .swt { position: relative; width: 56px; height: 32px; flex: none; border: 0; padding: 0; border-radius: 16px; background: #D9D4EE; transition: background .2s; }
  .swt::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .swt[aria-checked="true"] { background: var(--lav-ink); } .swt[aria-checked="true"]::after { transform: translateX(24px); }
  .swrow { display: flex; align-items: center; gap: 14px; font-size: 14.5px; font-weight: 600; }
  .swrow span { flex: 1; }

  /* bottom nav */
  nav { position: fixed; left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 30; max-width: 488px; margin: 0 auto; height: 72px; border-radius: 36px;
        background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
  nav .in { height: 100%; display: flex; align-items: center; padding: 0 8px; }
  nav .tab { flex: 1 1 0; min-width: 0; height: 100%; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12.5px; font-weight: 700; color: var(--cap); position: relative; padding: 0; }
  nav .tab svg { width: 24px; height: 24px; }
  nav .tab[aria-selected="true"] { color: var(--lav-ink); }
  nav .tab[aria-selected="true"]::after { content: ""; position: absolute; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--lav-ink); }
  nav .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 20px; height: 20px; border-radius: 10px; background: var(--rose-ink); color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
  nav .badge[hidden] { display: none; }

  /* settings sheet */
  #sheet { position: fixed; inset: 0; z-index: 50; overflow-y: auto; display: none; background: linear-gradient(160deg, #F6EEFF 0%, #FDE9F1 35%, #FFF2E6 70%, #E9F3FF 100%); }
  #sheet.open { display: block; }
  #sheet .in { max-width: 520px; margin: 0 auto; padding: 16px 16px 48px; }
  .range { width: 100%; height: 44px; accent-color: var(--lav-ink); }
  .ticks { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; padding: 0 2px; color: var(--body); }
  .btn { min-height: 52px; border-radius: 999px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.8); padding: 0 24px; font-weight: 700; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
  .btn.danger { background: var(--rose); border-color: var(--rose); color: var(--rose-d); }
  .btn.solid { background: var(--red); color: #fff; border-color: var(--red); }
  .switch-off { display: flex; align-items: center; gap: 12px; color: var(--body); }
  .switch-off .sw { width: 56px; height: 32px; border-radius: 16px; background: #D9D4EE; position: relative; flex: none; }
  .switch-off .sw::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; }
  .toast { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 999px; padding: 12px 24px; z-index: 60; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--lav-ink); outline-offset: 2px; }

  /* first-paint motion: cards fade + rise, staggered 40 ms */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  #view.anim > * { animation: rise .24s ease-out both; }
  #view.anim > :nth-child(2) { animation-delay: 40ms; } #view.anim > :nth-child(3) { animation-delay: 80ms; } #view.anim > :nth-child(4) { animation-delay: 120ms; }
  #view.anim > :nth-child(5) { animation-delay: 160ms; } #view.anim > :nth-child(6) { animation-delay: 200ms; } #view.anim > :nth-child(7) { animation-delay: 240ms; }
  #view.anim > :nth-child(n+8) { animation-delay: 280ms; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div><div class="blob b2" aria-hidden="true"></div>
<div id="app">
  <header class="top">
    <div class="avatar" id="avatar" aria-hidden="true"><img src="/static/avatar-girl.png" alt="" width="48" height="48"></div>
    <div class="who" id="who">My child<small>Whyscope</small></div>

      line += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + " " + cl(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + " " +
        (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + " " + cl(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }

    return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(tr("sparkAria", daily.map((d) => d.count).join(LANG === "zh" ? "、" : ", "))) + '">' +
      '<defs><linearGradient id="sgA" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#C7B8FF" stop-opacity=".85"/><stop offset="1" stop-color="#BFE0FF" stop-opacity=".85"/></linearGradient>' +
      '<linearGradient id="sgL" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7C6CFF"/><stop offset="1" stop-color="#2B6CB0"/></linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#sgA)"/><path d="' + line + '" fill="none" stroke="url(#sgL)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
      pts.map((p, i) => (i === n - 1 ? '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="7" fill="#5B4AB8" stroke="#fff" stroke-width="3"/>' : '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="#fff" stroke="#7C6CFF" stroke-width="2"/>') +
        '<text x="' + p[0] + '" y="' + (H - 6) + '" text-anchor="middle"' + (i === n - 1 ? ' font-weight="800"' : "") + ">" + wdLabel(daily[i].weekday) + "</text>").join("") + "</svg>";
  }
  function donut(topics) {
    const total = topics.reduce((a, t) => a + t.count, 0); let acc = 0;
    const segs = topics.map((t) => {
      const frac = (t.count / total) * 100, col = topicOf(t.topic)[2], gap = topics.length > 1 ? 1.4 : 0;
      const s = '<circle class="seg" cx="21" cy="21" r="15.915" fill="none" stroke="' + col + '" stroke-width="3.9" stroke-linecap="butt" stroke-dasharray="' + Math.max(0, frac - gap).toFixed(2) + " " + (100 - Math.max(0, frac - gap)).toFixed(2) +
        '" stroke-dashoffset="' + (25 - acc).toFixed(2) + '" data-topic="' + esc(t.topic) + '" tabindex="0" role="button" aria-label="' + esc(tr("viewLog", topicName(t.topic), t.count)) + '"/>';
      acc += frac; return s;
    }).join("");
    return '<svg class="donut" viewBox="0 0 42 42" role="group" aria-label="' + esc(tr("donutAria")) + '">' +

  }
  function viewWeek() {

    if (rep.bridges_used.length) {
      h += "<h2>" + tr("examples") + "</h2><div class=\"wrapchips\">" + rep.bridges_used.map((b) => '<span class="chip">' + esc(b.emoji) + " " + esc(tr("explained", BRIDGE[b.key] ? tr("bb_" + b.key) : "", b.objects.slice(0, 2).join("、"))) + "</span>").join("") + "</div>";

  // ---------- 時刻 / Moments: one timeline (photos + plain events) ----------
  const polRot = (id) => (((id * 7919) % 61) / 10 - 3).toFixed(1);   // -3.0..3.0 deg, the same for an id every time
  const polDate = (ts) => { const d = pd(ts); return dayLabel(d) + " " + hm(d); };
  // events plus any stored photo that fell outside the event window
  const allItems = () => { const ev = S.data.ev, ids = new Set(ev.map((e) => e.id)); return ev.map((e) => Object.assign({}, e, { snapshot: !!e.snapshot })).concat((S.data.snaps || []).filter((x) => !ids.has(x.id)).map((x) => Object.assign({}, x, { snapshot: true }))); };
  const KINDS = [["all", "all"], ["photos", "fPhotos"], ["unsure", "fUnsure"], ["parents", "fParents"]];
  const kindOk = { all: () => true, photos: (e) => e.snapshot, unsure: (e) => e.status === "abstained", parents: (e) => e.status === "sensitive" };
  function viewMoments() {
    const all = allItems();
    if (!all.length) {
      const on = S.data.set.snapshots;
      return '<div class="card">' + empty(on ? tr("momentsNone") : tr("momentsEmpty"), "chars", on ? "" : '<button class="btn" data-opensettings="1">' + esc(tr("openSettings")) + "</button>") + "</div>";
    }
    let h = '<div class="filters" role="group" aria-label="' + esc(tr("filterBy")) + '">' + KINDS.map((k, i) => '<button class="chip" data-filter="' + (k[0] === "all" ? "" : k[0]) + '" aria-pressed="' + (S.kind === k[0] && !S.topic) + '">' + esc(tr(k[1])) + "</button>" + (i === 0 && S.topic ? '<button class="chip" data-tfilter="1" aria-pressed="true">' + topicOf(S.topic)[0] + " " + esc(topicName(S.topic)) + " ✕</button>" : "")).join("") + "</div>";
    const rows = all.filter((e) => kindOk[S.kind](e) && (!S.topic || e.topic === S.topic)).sort((a, b) => (a.ts < b.ts ? 1 : -1));
    if (!rows.length) return h + '<div class="card">' + empty(tr("noMatch"), "chars") + "</div>";
    const groups = {};
    rows.forEach((e) => { const d = pd(e.ts); (groups[dayKey(d)] = groups[dayKey(d)] || { d, list: [] }).list.push(e); });
    Object.keys(groups).sort().reverse().forEach((k) => {

      h += '<div class="day">' + esc(dayLabel(g.d)) + '</div><div class="tl">' + g.list.map((e) => {
        if (e.snapshot) return '<button class="pol" style="--rot:' + polRot(e.id) + 'deg" data-pol="' + e.id + '" aria-label="' + esc(tr("openPhoto", e.question || "")) + '"><div class="ph"><img src="/api/snapshots/' + e.id +
          '.jpg" alt="" loading="lazy" decoding="async"></div><div class="cap">' + esc(e.question || tr("noCatch")) + '</div><div class="dt">' + hm(pd(e.ts)) + "</div></button>";
        const st = STATUS[e.status] || ["", ""], em = e.emoji || (e.status === "sensitive" ? "🛡️" : e.status === "abstained" ? "❓" : topicOf(e.topic)[0]);
        return '<button class="ev" data-pol="' + e.id + '"><span class="em" style="background:' + pal(e.status === "sensitive" ? "rose" : e.status === "abstained" ? "lemon" : topicOf(e.topic)[3])[0] + '" aria-hidden="true">' + esc(em) + '</span><span class="nm">' + esc(e.question || e.object || tr("noCatch")) +

      }).join("") + "</div>";

  }
  let polFrom = null;
  function closePol() { const w = $("#polwrap"); if (!w.classList.contains("open")) return; w.classList.remove("open"); w.innerHTML = ""; if (polFrom && polFrom.isConnected) polFrom.focus({ preventScroll: true }); polFrom = null; }

      '<figure class="pol" style="--rot:' + (polRot(id) / 2).toFixed(1) + 'deg">' + (photo ? '<div class="ph"><img src="/api/snapshots/' + id + '.jpg" alt="' + esc(tr("photoAlt")) + '"></div>' :
        '<div class="nph"><span class="em" style="background:' + pal(p.status === "sensitive" ? "rose" : p.status === "abstained" ? "lemon" : topicOf(p.topic)[3])[0] + '" aria-hidden="true">' + esc(em) + "</span></div>") + '<figcaption><div class="cap">' + esc(p.question || tr("noCatch")) +
      '</div><div class="dt">' + esc(polDate(p.ts)) + "</div>" + (ans ? '<div class="ans">' + esc(ans) + "</div>" : "") + (p.status === "answered" && p.ask_back ? '<div class="ans b">' + esc(p.ask_back) + "</div>" : "") + '</figcaption></figure>' +

      $("#polno").onclick = () => openPol(id, polFrom);

  // ---------- 小抄 ----------

        ((c.sources || []).length ? '<div class="srcs">' + c.sources.map((s) => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.publisher || s.title || tr("sources")) + " ↗</a>").join("") + "</div>" : "") +
        '<button class="okbtn" data-cheat="' + c.event_id + '"' + (c.cheat_done ? " disabled" : "") + ">" + (c.cheat_done ? tr("talkedDone") : tr("talked")) + "</button></div></article>";

  function viewKid() {

  // ---------- render / events ----------
  const VIEWS = { week: viewWeek, moments: viewMoments, cheats: viewCheats, kid: viewKid };
  let animNext = true;   // fade+rise only on first paint and tab switches, not on every refresh
  function render() {

  }

  document.addEventListener("click", async (e) => {

      else if (t.dataset.talked) { await post("/api/events/" + t.dataset.talked + "/talked"); toast(tr("noted")); await refresh(); }
      else if (t.dataset.seg) { S.ageSeg = t.dataset.seg; render(); }

  });
  document.addEventListener("change", async (e) => {

      catch (err) { toast(tr("failTry")); }

  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.closest && e.target.closest(".donut circle.seg")) e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); });

  // ---------- settings sheet ----------
  const RET = [7, 30, 90];
  const photosHtml = (set) => "<h2>" + tr("photos") + '</h2><div class="card"><div class="swrow"><span id="swlbl">' + tr("photosToggle") + '</span><button class="swt" id="snapsw" role="switch" aria-checked="' + !!set.snapshots + '" aria-labelledby="swlbl"></button></div>' +
    '<p class="note" id="snapnote">' + esc(tr("photosNote", set.snapshot_count || 0, set.snapshots_retention_days || 30)) + '</p><div id="snapdel" style="margin-top:12px"><button class="btn danger" id="snapclear">🗑️ ' + esc(tr("photosDelete")) + "</button></div></div>";
  function bindPhotos() {

    };
  }
  function openSheet() {
    const set = S.data.set, ri = Math.max(0, RET.indexOf(set.retention_days));
    $("#sheetin").innerHTML = '<div class="row" style="margin-bottom:6px"><button class="icon-btn" id="back" aria-label="' + esc(tr("back")) + '"><svg viewBox="0 0 24 24" fill="none" stroke="#2B2A4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2 style="margin:0;font-size:19px">' + tr("settings") + '</h2></div>' +
      "<h2>" + tr("keepFor") + '</h2><div class="card"><input class="range" id="ret" type="range" min="0" max="2" step="1" value="' + ri + '" aria-label="' + esc(tr("retAria")) + '"><div class="ticks"><span>' + tr("days", 7) + "</span><span>" + tr("days", 30) + "</span><span>" + tr("days", 90) + '</span></div><p class="note" id="retnote">' + tr("retNow", set.retention_days) + "</p></div>" +
      "<h2>" + tr("cloud") + '</h2><div class="card"><div class="switch-off"><span class="sw" aria-hidden="true"></span><span>' + tr("cloudOff") + '  <small style="color:var(--body);font-size:12.5px">' + tr("cloudSoon") + "</small></span></div></div>" +
      photosHtml(set) +
      "<h2>" + tr("data") + '</h2><div class="card" style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="/api/data/export" download="whyscope-export.json">⬇️ ' + tr("export") + '</a><button class="btn danger" id="clear">🗑️ ' + tr("clear") + "</button></div>" +
      '<p class="note" id="ver">' + esc(tr("ver", set.version || "", set.mode || "")) + "</p>";
    $("#sheet").classList.add("open"); $("#back").focus();
    $("#back").onclick = () => $("#sheet").classList.remove("open");
    $("#ret").onchange = async (e) => { const d = RET[+e.target.value]; try { await post("/api/settings", { retention_days: d }); $("#retnote").textContent = tr("retNow", d); toast(tr("saved")); await load(); } catch (err) { toast(tr("fail")); } };
    bindPhotos();
    $("#clear").onclick = () => {
      $("#clear").outerHTML = '<span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>' + esc(tr("clearAsk")) + '</b><button class="btn solid" id="yes">' + esc(tr("clearYes")) + '</button><button class="btn" id="no">' + esc(tr("clearNo")) + "</button></span>";
      $("#no").onclick = openSheet;
      $("#yes").onclick = async () => { try { await post("/api/data/clear"); toast(tr("cleared")); await refresh(); } catch (err) { toast(tr("fail")); } $("#sheet").classList.remove("open"); };
    };
  }
  $("#gear").onclick = () => S.data && openSheet();
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePol(); $("#sheet").classList.remove("open"); } });

  // ---------- start ----------
  const h0 = location.hash.slice(1) === "log" ? "moments" : location.hash.slice(1); if (VIEWS[h0]) S.tab = h0;
  applyLang();
  refresh();
  setInterval(refresh, 30000);
  window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== S.tab) go(t); });
})();
</script>
</body>
</html>
