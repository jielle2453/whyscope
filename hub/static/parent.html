<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EEFF">
<title>Whyscope | Parent</title>
<style>
  :root {
    --ink: #2B2A4A; --body: #5A5878; --cap: #6E6C8E;
    --lav: #C7B8FF; --lav-ink: #5B4AB8; --lav-d: #3B2F8F; --sky: #BFE0FF; --sky-ink: #2B6CB0; --sky-d: #1E4E80;
    --peach: #FFD6C2; --peach-ink: #C2410C; --peach-d: #9A3412; --mint: #CBF3E3; --mint-ink: #1F7A5C; --mint-d: #14604A;
    --lemon: #FFF1B8; --lemon-ink: #8A6D00; --lemon-d: #6B5400; --rose: #FFD1E0; --rose-ink: #B4306B; --rose-d: #8F2257;
    --red: #C62828;
    --glass: rgba(255,255,255,0.62); --glass-line: rgba(255,255,255,0.8); --shadow: 0 10px 30px rgba(96,80,140,0.10);
    --r: 28px; --btn: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { color: var(--ink); min-height: 100vh; position: relative; overflow-x: hidden;
         background: linear-gradient(160deg, #F6EEFF 0%, #FDE9F1 35%, #FFF2E6 70%, #E9F3FF 100%) fixed;
         font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; }
  .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .4; pointer-events: none; z-index: 0; }
  .blob.b1 { width: 320px; height: 320px; background: #CDB8FF; top: -100px; left: -110px; }
  .blob.b2 { width: 300px; height: 300px; background: #FFD3B6; bottom: -90px; right: -100px; }
  button { font: inherit; color: inherit; cursor: pointer; transition: transform .12s; }
  button:active:not(:disabled) { transform: scale(.96); }
  #app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding: 0 16px 128px; }
  .glass, .card, .li, .ev, .cheat, .tcard, div.seg, .lang, .icon-btn.g { background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
           border: 1px solid var(--glass-line); box-shadow: var(--shadow); }

  /* top bar */
  .top { display: flex; align-items: center; gap: 8px; padding: 16px 0 8px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--lav); display: grid; place-items: center; font-size: 22px; flex: none; position: relative; }
  .avatar img { border-radius: 50%; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .top .who { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .who small { display: block; font-size: 12.5px; font-weight: 500; color: var(--body); }
  .dev { position: absolute; padding: 0; box-sizing: border-box; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; background: #A9A7C2; border: 2.5px solid #FFFFFF; box-shadow: 0 1px 3px rgba(43,42,74,.18); }
  .dev.ok { background: #3DBE8B; }
  .dev i { display: none; }
  .dev span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .icon-btn { width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; flex: none; padding: 0; background: var(--glass); }
  .icon-btn svg { width: 22px; height: 22px; }
  .lang { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--cap); flex: none; }
  .lang button { position: relative; border: 0; background: none; color: inherit; padding: 3px 9px; border-radius: 999px; min-width: 30px; }
  .lang button::after { content: ""; position: absolute; inset: -14px -2px; }
  .lang button[aria-pressed="true"] { background: var(--lav-ink); color: #fff; }
  .lang i { font-style: normal; opacity: .5; }

  /* segmented */
  div.seg { display: flex; border-radius: 999px; padding: 4px; margin: 8px 0 16px; gap: 4px; }
  .seg button { flex: 1; min-height: 44px; border: 0; background: none; border-radius: 999px; font-weight: 700; color: var(--body); }
  .seg button[aria-pressed="true"] { background: var(--lav-ink); color: #fff; }

  /* cards & text */
  .card { border-radius: var(--r); padding: 22px 14px; margin-bottom: 16px; }
  h2 { font-size: 16px; font-weight: 700; margin: 22px 4px 11px; display: flex; align-items: center; gap: 8px; color: var(--ink); }
  h2 .n { margin-left: auto; font-size: 14.5px; font-weight: 700; color: var(--lav-d); background: var(--lav); border-radius: 999px; padding: 0 12px; }
  .hero { display: flex; align-items: flex-end; gap: 12px; padding: 0 8px; }
  .hero .big { font-size: 54px; font-weight: 800; line-height: .95; letter-spacing: -1px; }
  .hero .lbl { font-size: 12.5px; font-weight: 700; color: var(--body); padding-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 700; border: 0;
          background: rgba(255,255,255,.7); color: var(--ink); }
  .chip.up { background: var(--mint); color: var(--mint-d); } .chip.down { background: var(--peach); color: var(--peach-d); }
  .spark { width: 100%; height: 108px; display: block; margin-top: 16px; }
  .spark text { font-size: 12.5px; fill: #5A5878; }
  .row { display: flex; align-items: center; gap: 12px; }
  .wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .wrapchips .chip { background: var(--sky); color: var(--sky-d); font-size: 13px; }
  .talk-btn { min-height: 48px; border-radius: 999px; border: 0; background: var(--mint); color: var(--mint-d); font-weight: 700; padding: 0 20px; white-space: nowrap; }

  /* topic discs + donut */
  .discs { display: flex; justify-content: space-between; gap: 4px; margin-bottom: 24px; }
  .disc { flex: 1; min-width: 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; }
  .disc .d { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; }
  .disc b { font-size: 14px; font-weight: 800; color: var(--ink); line-height: 1.2; }
  .disc span.t { font-size: 12.5px; color: var(--body); line-height: 1.2; text-align: center; overflow-wrap: normal; }
  .donut { width: 132px; height: 132px; display: block; margin: 0 auto; }
  .donut circle.seg { cursor: pointer; transition: stroke-width .15s; }
  .donut circle.seg:hover, .donut circle.seg:focus { stroke-width: 4.8; outline: none; }

  /* swipe cards */
  .swipe { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 16px 16px; margin: 0 -16px; scrollbar-width: none; }
  .swipe::-webkit-scrollbar { display: none; }
  .tcard { scroll-snap-align: center; flex: 0 0 76%; border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
  .tcard .hd { height: 72px; display: flex; align-items: center; padding: 0 18px; }
  .tcard .em { font-size: 35px; line-height: 1; }
  .tcard .bd { padding: 14px 18px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .tcard .obj { font-size: 19px; font-weight: 700; line-height: 1.3; }
  .tcard .ask { font-size: 14.5px; color: var(--body); flex: 1; }
  .tcard .talk-btn { align-self: flex-end; margin-top: 8px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .li { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 24px; }
  .li .em { width: 44px; height: 44px; border-radius: 50%; background: var(--lemon); display: grid; place-items: center; font-size: 19px; flex: none; }
  .li .tx { flex: 1; min-width: 0; font-size: 14.5px; }

  /* empty */
  .empty { text-align: center; padding: 14px 8px; color: var(--body); }
  .empty .eb { width: 96px; height: 96px; border-radius: 50%; background: var(--lav); display: grid; place-items: center; font-size: 38px; margin: 0 auto 12px; }
  .empty p { margin: 0; font-size: 14.5px; }

  /* log */
  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters .chip { flex: none; min-height: 44px; font-size: 14px; padding: 0 14px; border: 1px solid var(--glass-line); }
  .filters .chip[aria-pressed="true"] { background: var(--lav-ink); color: #fff; }
  .day { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--lav-d); background: var(--lav); border-radius: 999px; padding: 2px 14px; margin: 16px 0 8px; }
  .ev { border-radius: 24px; }
  button.ev { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px 14px; text-align: left; }
  .ev .em { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; flex: none; }
  .ev .nm { flex: 1; font-size: 14.5px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .st { font-size: 18px; flex: none; }
  .ev .tm { font-size: 12.5px; color: var(--body); flex: none; min-width: 48px; text-align: right; }
  .tl { display: flex; flex-direction: column; gap: 12px; }

  /* cheats */
  .cheat { border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
  .cheat .hd { display: flex; align-items: center; gap: 12px; padding: 11px 14px; font-weight: 800; font-size: 16px; }
  .cheat .hd .em { font-size: 24px; }
  .cheat .hd .when { margin-left: auto; font-size: 12.5px; font-weight: 600; }
  .cheat .bd { padding: 14px; }
  .cheat .said { font-size: 14.5px; color: var(--body); margin: 0 0 12px; }
  .cheat ul { margin: 0 0 12px; padding-left: 20px; } .cheat li { margin-bottom: 8px; font-size: 14.5px; }
  .nosay { background: rgba(236,232,248,.85); color: #4A4868; border-radius: 20px; padding: 11px 14px; margin-bottom: 12px; font-size: 14.5px; }
  .nosay b { display: block; margin-bottom: 2px; }
  .nosay ul { margin: 0; padding-left: 20px; } .nosay li { font-size: 14.5px; margin: 2px 0; }
  .srcs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .srcs a { font-size: 12.5px; font-weight: 600; color: var(--sky-d); background: var(--sky); border-radius: 999px; padding: 6px 13px; text-decoration: none; min-height: 36px; display: inline-flex; align-items: center; }
  .cheat.urgent { border: 2px solid var(--red); } .cheat.urgent .bd { background: rgba(255,209,224,.38); }
  .tel { display: flex; gap: 12px; margin-bottom: 12px; }
  .tel a { flex: 1; min-height: 64px; border-radius: 999px; background: var(--rose); color: var(--rose-d); font-weight: 800; font-size: 17.5px; text-decoration: none; display: grid; place-items: center; text-align: center; line-height: 1.15; }
  .tel a small { display: block; font-size: 12.5px; font-weight: 600; }
  .okbtn { width: 100%; min-height: 52px; border-radius: 999px; border: 0; background: var(--mint); color: var(--mint-d); font-weight: 800; }
  .okbtn[disabled] { background: rgba(255,255,255,.7); color: var(--mint-d); cursor: default; }

  /* to answer (parent assistant) */
  .todo { padding: 16px 14px 14px; }
  .todo .q { font-size: 16px; font-weight: 800; line-height: 1.3; }
  .todo .meta { font-size: 12.5px; color: var(--body); margin-top: 2px; }
  .todo .draft { margin: 12px 0 0; background: rgba(255,255,255,.75); border-radius: 20px; padding: 12px 14px; font-size: 14.5px; white-space: pre-line; }
  .todo .warn { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--peach-d); background: var(--peach); border-radius: 14px; padding: 6px 12px; }
  .todo .good { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--mint-d); }
  .todo .note { margin: 10px 2px 0; }
  .todo .tag { display: inline-block; font-size: 12.5px; font-weight: 800; color: var(--lemon-d); background: var(--lemon); border-radius: 999px; padding: 2px 12px; margin-bottom: 8px; }
  .todo details { margin-top: 10px; font-size: 12.5px; color: var(--body); }
  .todo details summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
  .todo details ul { margin: 4px 0 0; padding-left: 18px; } .todo details li { margin-bottom: 4px; }
  .todo .acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .todo .acts .btn { min-height: 48px; padding: 0 18px; flex: 1 1 auto; }
  .todo .acts .btn.go { background: var(--mint); border-color: var(--mint); color: var(--mint-d); }
  .todo textarea { width: 100%; min-height: 150px; margin-top: 12px; border-radius: 20px; border: 1px solid var(--glass-line); padding: 12px 14px; font: inherit; font-size: 14.5px; line-height: 1.5; background: rgba(255,255,255,.85); color: var(--ink); resize: vertical; }
  .todo textarea:focus { outline: none; border-color: var(--lav-ink); }

  /* kid tab */
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tg { min-height: 64px; border-radius: 999px; border: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 14.5px; font-weight: 700; text-align: left;
        background: var(--pa, var(--lav)); color: var(--pd, var(--lav-d)); }
  .tg .em { font-size: 21px; }
  .tg[aria-pressed="true"] { background: var(--pi, var(--lav-ink)); color: #fff; }
  .ages { display: flex; justify-content: space-between; gap: 8px; }
  .ages button { width: 72px; height: 72px; flex: none; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass); font-size: 24px; font-weight: 800; color: var(--ink); }
  .ages button[aria-pressed="true"] { background: var(--lav-ink); color: #fff; border-color: var(--lav-ink); }
  input.txt { width: 100%; min-height: 56px; border-radius: 28px; border: 1px solid var(--glass-line); padding: 0 22px; font: inherit; font-size: 14.5px; background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: var(--ink); box-shadow: var(--shadow); }
  input.txt::placeholder { color: var(--cap); }
  input.txt:focus { outline: none; border-color: var(--lav-ink); }
  .note { color: var(--body); font-size: 12.5px; margin: 12px 4px 0; }
  .recent { font-size: 14px; background: var(--lemon); color: var(--lemon-d); border-radius: 999px; padding: 6px 14px; font-weight: 600; }

  /* avatars */
  .avs { display: flex; gap: 12px; }
  .avs button { width: 72px; height: 72px; flex: none; padding: 0; border-radius: 50%; border: 3px solid var(--glass-line); background: var(--lav); overflow: hidden; display: grid; place-items: center; font-size: 30px; }
  .avs button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avs button[aria-pressed="true"] { border-color: var(--lav-ink); box-shadow: 0 0 0 3px var(--lav); }
  .chars { display: block; width: 320px; max-width: 100%; height: auto; margin: 0 auto 8px; }
  .empty .btn { margin-top: 14px; }

  /* snapshots: polaroid cards */
  .pol { position: relative; margin: 0; padding: 8px 8px 12px; background: #fff; border-radius: 6px; box-shadow: 0 8px 22px rgba(96,80,140,.20), 0 1px 3px rgba(96,80,140,.12); }
  .pol .ph { position: relative; border-radius: 3px; overflow: hidden; background: #EDE8F8; line-height: 0; }
  .pol .ph img { width: 100%; height: auto; display: block; filter: sepia(.18) saturate(1.08) contrast(1.03) brightness(1.02); }
  .pol .ph::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 3px;
                    box-shadow: inset 0 0 0 6px rgba(255,255,255,.55), inset 0 0 34px rgba(70,45,20,.30); background: rgba(255,196,130,.07); }
  .pol .cap { font-style: italic; font-weight: 600; color: var(--ink); font-size: 14px; line-height: 1.3; margin-top: 10px; padding: 0 2px;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .pol .dt { font-size: 12.5px; color: var(--cap); padding: 0 2px; margin-top: 2px; }
  .tl button.pol { width: min(100%, 300px); align-self: center; margin: 4px 0; }
  button.pol { border: 0; text-align: left; display: block; transform: rotate(var(--rot, 0deg)); transition: transform .15s; }
  button.pol:active:not(:disabled) { transform: rotate(var(--rot, 0deg)) scale(.97); }
  #polwrap { position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(43,42,74,.5);
             -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); overflow-y: auto; }
  #polwrap.open { display: flex; }
  .polcard { position: relative; width: 100%; max-width: 340px; margin: auto; }
  .polcard .pol { padding: 12px 12px 16px; transform: rotate(var(--rot, 0deg)); }
  .polcard .pol .cap { font-size: 17px; -webkit-line-clamp: 4; }
  .polcard .ans { font-size: 14.5px; color: var(--body); margin: 10px 2px 0; padding-top: 10px; border-top: 1px dashed #DDD6F0; }
  .polcard .ans.b { margin-top: 6px; padding-top: 0; border-top: 0; color: var(--peach-d); font-weight: 600; }
  .pol .nph { display: flex; align-items: center; justify-content: center; padding: 14px 0 4px; }
  .pol .nph .em { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; }
  .polcard .acts { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .polx { position: absolute; top: -14px; right: -6px; z-index: 2; background: #fff; box-shadow: var(--shadow); }
  .swt { position: relative; width: 56px; height: 32px; flex: none; border: 0; padding: 0; border-radius: 16px; background: #D9D4EE; transition: background .2s; }
  .swt::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .swt[aria-checked="true"] { background: var(--lav-ink); } .swt[aria-checked="true"]::after { transform: translateX(24px); }
  .swrow { display: flex; align-items: center; gap: 14px; font-size: 14.5px; font-weight: 600; }
  .swrow span { flex: 1; }

  /* connection badge, child switcher, modals, family */
  .cbadge { display: inline-flex; align-items: center; gap: 5px; margin-left: 6px; padding: 0 9px; min-height: 20px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--cap); background: rgba(255,255,255,.7); vertical-align: middle; }
  .cbadge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #A9A7C2; }
  .cbadge[data-mode="home"] { color: var(--mint-d); } .cbadge[data-mode="home"]::before { background: #3DBE8B; }
  .cbadge[data-mode="away"] { color: var(--sky-d); } .cbadge[data-mode="away"]::before { background: #2B6CB0; }
  .cbadge[data-mode="offline"], .cbadge[data-mode="revoked"], .cbadge[data-mode="unpaired"] { color: var(--peach-d); } .cbadge[data-mode="offline"]::before, .cbadge[data-mode="revoked"]::before, .cbadge[data-mode="unpaired"]::before { background: #E07B39; }
  .kids { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .kids::-webkit-scrollbar { display: none; }
  .kids[hidden] { display: none; }
  .kids .kc { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 4px 16px 4px 5px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); font-weight: 700; color: var(--ink); }
  .kids .kc .kav { width: 38px; height: 38px; border-radius: 50%; background: var(--lav); display: grid; place-items: center; overflow: hidden; font-size: 18px; }
  .kids .kc .kav img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .kids .kc[aria-pressed="true"] { background: var(--lav-ink); color: #fff; border-color: var(--lav-ink); }
  .kids .kc .kn { min-width: 20px; height: 20px; border-radius: 10px; background: var(--rose-ink); color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
  #pinwrap, #qrwrap { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(43,42,74,.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); overflow-y: auto; }
  #pinwrap.open, #qrwrap.open { display: flex; }
  .modal { width: 100%; max-width: 380px; margin: auto; background: #fff; border-radius: 28px; padding: 22px 20px; box-shadow: var(--shadow); text-align: center; }
  .modal h2 { justify-content: center; margin: 0 0 6px; }
  .modal p { margin: 6px 0; color: var(--body); }
  .modal .acts { display: flex; gap: 8px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }
  .modal .btn.go { background: var(--lav-ink); color: #fff; border-color: var(--lav-ink); }
  .modal .err { color: var(--rose-d); font-weight: 700; }
  .qrimg { width: min(100%, 320px); margin: 10px auto; }
  .qrimg svg { width: 100%; height: auto; display: block; border: 1px solid #E5E0F3; border-radius: 8px; }
  .modal details { text-align: left; margin-top: 8px; font-size: 12.5px; } .modal summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
  .modal textarea { width: 100%; height: 84px; border-radius: 14px; border: 1px solid #E5E0F3; padding: 6px 10px; font: 11px/1.4 ui-monospace, Consolas, monospace; word-break: break-all; }
  .famrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
  .famrow .kav { width: 40px; height: 40px; border-radius: 50%; background: var(--lav); display: grid; place-items: center; overflow: hidden; flex: none; }
  .famrow .kav img { width: 100%; height: 100%; object-fit: cover; }

      else if (t.dataset.opensettings) openSheet();
      else if (t.dataset.approve) { await post("/api/todo/" + t.dataset.approve + "/approve"); toast(tr("approvedToast")); await refresh(); }
      else if (t.dataset.edit) { const it = S.data.todo.items.find((x) => x.id === +t.dataset.edit); S.editing = +t.dataset.edit; S.editText = (it && (it.draft || it.partial)) || ""; render(); const ta = $("#todotext"); if (ta) ta.focus(); }
      else if (t.dataset.cancel) { S.editing = null; render(); }
      else if (t.dataset.save) { const txt = ($("#todotext") || {}).value || ""; if (!txt.trim()) { toast(tr("failTry")); return; } await post("/api/todo/" + t.dataset.save + "/approve", { answer: txt }); S.editing = null; toast(tr("approvedToast")); await refresh(); }
      else if (t.dataset.dismiss) { await post("/api/todo/" + t.dataset.dismiss + "/dismiss"); toast(tr("dismissedToast")); await refresh(); }
      else if (t.dataset.redraft) { await post("/api/todo/" + t.dataset.redraft + "/redraft"); await refresh(); }
      else if (t.dataset.avatar) { await post("/api/memory", { key: "avatar", value: t.dataset.avatar }); await refresh(); }
      else if (t.dataset.talked) { await post("/api/events/" + t.dataset.talked + "/talked"); toast(tr("noted")); await refresh(); }
      else if (t.dataset.seg) { S.ageSeg = t.dataset.seg; render(); }
      else if (t.dataset.cheat) { await post("/api/cheats/" + t.dataset.cheat + "/done"); toast(tr("noted")); await refresh(); }
      else if (t.dataset.mem) {
        const k = t.dataset.mem, was = t.getAttribute("aria-pressed") === "true";
        if (was) await api("/api/memory?key=" + k, { method: "DELETE" });
        else await post("/api/memory", { key: k, value: k === "has_sibling" ? "有" : true });
        await refresh();
      } else if (t.dataset.age) { await post("/api/memory", { key: "child_age", value: +t.dataset.age }); await refresh(); }
    } catch (err) { if (!err.cancel) toast(tr(err.detail === "pin_locked" ? "pinLocked" : "failTry")); }
  });
  document.addEventListener("change", async (e) => {
    if (e.target.id === "cname") {
      const val = e.target.value.trim();
      try { if (val) await post("/api/memory", { key: "child_name", value: val }); else await api("/api/memory?key=child_name", { method: "DELETE" }); toast(tr("saved")); await load(); }
      catch (err) { toast(tr("failTry")); }
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.closest && e.target.closest(".donut circle.seg")) e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); });

  // ---------- settings sheet ----------
  const RET = [7, 30, 90];
  const photosHtml = (set) => "<h2>" + tr("photos") + '</h2><div class="card"><div class="swrow"><span id="swlbl">' + tr("photosToggle") + '</span><button class="swt" id="snapsw" role="switch" aria-checked="' + !!set.snapshots + '" aria-labelledby="swlbl"></button></div>' +
    '<p class="note" id="snapnote">' + esc(tr("photosNote", set.snapshot_count || 0, set.snapshots_retention_days || 30)) + '</p><div id="snapdel" style="margin-top:12px"><button class="btn danger" id="snapclear">🗑️ ' + esc(tr("photosDelete")) + "</button></div></div>";
  const guessHtml = (set) => "<h2>" + tr("guessTitle") + '</h2><div class="card"><div class="swrow"><span id="gslbl">' + tr("guessToggle") + '</span><button class="swt" id="guesssw" role="switch" aria-checked="' + (set.ai_guess !== false) + '" aria-labelledby="gslbl"></button></div>' +
    '<p class="note">' + esc(tr("guessNoteSet")) + "</p></div>";
  function bindGuess() {
    const b = $("#guesssw"); if (!b) return;
    b.onclick = async () => {
      const on = b.getAttribute("aria-checked") !== "true";
      try { await post("/api/settings", { ai_guess: on }); toast(tr("saved")); await load(); render(); openSheet(); $("#guesssw").focus(); } catch (err) { if (!err.cancel) toast(tr("fail")); }
    };
  }
  function bindPhotos() {
    $("#snapsw").onclick = async () => {
      const on = $("#snapsw").getAttribute("aria-checked") !== "true";
      try { await post("/api/settings", { snapshots: on }); toast(tr("saved")); await load(); render(); openSheet(); $("#snapsw").focus(); } catch (err) { if (!err.cancel) toast(tr("fail")); }
    };
    $("#snapclear").onclick = () => {
      $("#snapdel").innerHTML = '<span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>' + esc(tr("photosDeleteAsk")) + '</b><button class="btn solid" id="snapyes">' + esc(tr("clearYes")) + '</button><button class="btn" id="snapno">' + esc(tr("clearNo")) + "</button></span>";
      $("#snapno").onclick = openSheet;
      $("#snapyes").onclick = async () => { try { await api("/api/snapshots", { method: "DELETE" }); toast(tr("photosDeleted")); await load(); render(); openSheet(); } catch (err) { toast(tr("fail")); } };
    };
  }
  async function addChild(name, age, avatar) {
    name = (name || "").trim();
    if (!name) { toast(tr("childName")); return; }
    try { const c = await post("/api/children", { name, age, avatar }); S.child = c.id; try { localStorage.setItem("whyscope_parent_child", String(c.id)); } catch (e) {} toast(tr("childAdded")); await refresh(); if ($("#sheet").classList.contains("open")) openSheet(); }
    catch (err) { if (!err.cancel) toast(tr("failTry")); }
  }
  const ago = (ts) => { if (!ts) return tr("neverSeen"); const d = pd(ts); return dayLabel(d) + " " + hm(d); };
  function famHtml() {
    const kids = S.children || [], devs = S.devices || [];
    let h = "<h2>" + tr("family") + '</h2><div class="card" id="famcard">';
    h += kids.map((k) => '<div class="famrow"><span class="kav" aria-hidden="true">' + avatarHtml(k.avatar, 40) + '</span><div class="grow"><b>' + esc(k.name) + "</b> <small>" + esc(tr("yearsOld", k.age)) + '</small></div><button class="btn sm" data-addwand="' + k.id + '">' + esc(tr("addWand", k.name)) + "</button></div>").join("");
    h += '<div class="addkid"><input class="txt" id="newkid2" maxlength="24" placeholder="' + esc(tr("childName")) + '" aria-label="' + esc(tr("childName")) + '">' +
      '<select id="newage" aria-label="' + esc(tr("ageLbl")) + '">' + [5, 6, 7, 8].map((a) => '<option value="' + a + '"' + (a === 6 ? " selected" : "") + ">" + a + "</option>").join("") + "</select>" +
      '<select id="newav" aria-label="' + esc(tr("avatar")) + '"><option value="girl">' + esc(tr("av_girl")) + '</option><option value="boy">' + esc(tr("av_boy")) + '</option><option value="emoji">' + esc(tr("av_emoji")) + "</option></select>" +
      '<button class="btn go sm" id="addkid2">' + esc(tr("addChild")) + "</button></div>";
    h += '<div style="margin-top:14px"><button class="btn" id="invite">' + esc(tr("invite")) + "</button></div>";
    h += '<h2 style="margin:18px 0 4px">' + esc(tr("devices")) + "</h2>" + (devs.length ? devs.map((d) => {
      const who = d.kind === "wand" ? tr("kindWand") + (d.child ? " · " + d.child : "") : tr("kindParent") + (d.parent ? " · " + d.parent : "");
      return '<div class="dev-li' + (d.revoked ? " off" : "") + '"><span aria-hidden="true">' + (d.kind === "wand" ? "🪄" : "📱") + '</span><div class="grow"><b>' + esc(d.name) + (d.current ? " (" + esc(tr("thisPhone")) + ")" : "") + "</b><small>" + esc(who) + (d.relay ? " · " + esc(tr("relayTag")) : "") + " · " + esc(d.last_seen ? tr("lastSeen", ago(d.last_seen)) : tr("neverSeen")) + "</small></div>" +
        (d.revoked ? '<span class="chip">' + esc(tr("revokedTag")) + "</span>" : S.revoking === d.id ? '<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>' + esc(tr("revokeAsk", d.name)) + '</b><button class="btn solid sm" data-revokeyes="' + d.id + '">' + esc(tr("revoke")) + '</button><button class="btn sm" data-revokeno="1">' + esc(tr("clearNo")) + "</button></span>"
          : '<button class="btn danger sm" data-revoke="' + d.id + '">' + esc(tr("revoke")) + "</button>") + "</div>";
    }).join("") : '<p class="note">' + esc(tr("neverSeen")) + "</p>");
    return h + "</div>";
  }
  async function loadDevices() { try { S.devices = await api("/api/devices"); const f = $("#famwrap"); if (f) { const keep = ($("#newkid2") || {}).value; f.innerHTML = famHtml(); if (keep) $("#newkid2").value = keep; } } catch (e) {} }
  async function showPairing(kind, childId, name) {
    let p;
    try { p = await post("/api/pairing", { kind, child_id: childId }); } catch (err) { if (!err.cancel) toast(tr(err.detail === "pin_locked" ? "pinLocked" : "failTry")); return; }
    const w = $("#qrwrap"), before = new Set((S.devices || []).map((d) => d.id)), end = Date.now() + p.expires_in * 1000;
    let timer = 0, poll = 0;
    const close = () => { clearInterval(timer); clearInterval(poll); w.classList.remove("open"); w.innerHTML = ""; if ($("#sheet").classList.contains("open")) loadDevices(); };
    w.innerHTML = '<div class="modal"><h2>' + esc(kind === "wand" ? tr("scanWand", name) : tr("scanParent")) + "</h2><p>" + esc(tr("scanHow")) + '</p><div class="qrimg">' + WhyQR.svg(p.url, { ecl: "L", label: "QR code" }) + "</div>" +
      '<p class="note">' + esc(tr(p.relay ? "relayYes" : "relayNo")) + " " + esc(tr("qrExpires")) + ' <b id="qleft"></b></p><details><summary>' + esc(tr("showLink")) + '</summary><textarea readonly id="qlink" aria-label="link"></textarea><a class="btn sm" id="qopen" target="_blank" rel="noopener" href="#">' + esc(tr("openLink")) + '</a></details><div class="acts"><button class="btn go" id="qdone">' + esc(tr("done")) + "</button></div></div>";
    $("#qlink").value = p.url; $("#qopen").href = p.url; w.classList.add("open"); $("#qdone").focus(); $("#qdone").onclick = close;
    timer = setInterval(() => { const s = Math.max(0, Math.round((end - Date.now()) / 1000)); const q = $("#qleft"); if (q) q.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); if (!s) close(); }, 1000);
    poll = setInterval(async () => {   // close by itself when the new device has scanned
      try { const d = await api("/api/devices"); if (d.some((x) => !before.has(x.id))) { S.devices = d; close(); toast(tr("pairedToast")); } } catch (e) {}
    }, 2000);
  }
  async function exportData() {
    try { const r = await api("/api/data/export"); const b = await r.blob(), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "whyscope-export.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    catch (err) { if (!err.cancel) toast(tr("exportFail")); }
  }
  document.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-addwand],#invite,#addkid2,[data-revoke],[data-revokeyes],[data-revokeno],#exportbtn");
    if (!t) return;
    try {
      if (t.dataset.addwand) { const c = S.children.find((k) => k.id === +t.dataset.addwand); await showPairing("wand", c.id, c.name); }
      else if (t.id === "invite") await showPairing("parent");
      else if (t.id === "addkid2") await addChild($("#newkid2").value, +$("#newage").value, $("#newav").value);
      else if (t.id === "exportbtn") await exportData();
      else if (t.dataset.revoke) { S.revoking = +t.dataset.revoke; loadDevices(); }
      else if (t.dataset.revokeno) { S.revoking = null; loadDevices(); }
      else if (t.dataset.revokeyes) { const id = +t.dataset.revokeyes; S.revoking = null; await api("/api/devices/" + id, { method: "DELETE" }); toast(tr("saved")); await loadDevices(); }
    } catch (err) { if (!err.cancel) toast(tr("failTry")); }
  });
  function openSheet() {
    const set = S.data.set, ri = Math.max(0, RET.indexOf(set.retention_days));
    $("#sheetin").innerHTML = '<div class="row" style="margin-bottom:6px"><button class="icon-btn" id="back" aria-label="' + esc(tr("back")) + '"><svg viewBox="0 0 24 24" fill="none" stroke="#2B2A4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2 style="margin:0;font-size:19px">' + tr("settings") + '</h2></div>' +
      '<div id="famwrap">' + famHtml() + "</div><h2>" + tr("keepFor") + '</h2><div class="card"><input class="range" id="ret" type="range" min="0" max="2" step="1" value="' + ri + '" aria-label="' + esc(tr("retAria")) + '"><div class="ticks"><span>' + tr("days", 7) + "</span><span>" + tr("days", 30) + "</span><span>" + tr("days", 90) + '</span></div><p class="note" id="retnote">' + tr("retNow", set.retention_days) + "</p></div>" +
      "<h2>" + tr("cloud") + '</h2><div class="card"><div class="switch-off"><span class="sw" aria-hidden="true"></span><span>' + tr("cloudOff") + '  <small style="color:var(--body);font-size:12.5px">' + tr("cloudSoon") + "</small></span></div></div>" +
      photosHtml(set) + guessHtml(set) +
      "<h2>" + tr("data") + '</h2><div class="card" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="exportbtn">⬇️ ' + tr("export") + '</button><button class="btn danger" id="clear">🗑️ ' + tr("clear") + "</button></div>" +
      '<p class="note" id="ver">' + esc(tr("ver", set.version || "", set.mode || "")) + "</p>";
    $("#sheet").classList.add("open"); $("#back").focus(); loadDevices();
    $("#back").onclick = () => $("#sheet").classList.remove("open");
    $("#ret").onchange = async (e) => { const d = RET[+e.target.value]; try { await post("/api/settings", { retention_days: d }); $("#retnote").textContent = tr("retNow", d); toast(tr("saved")); await load(); } catch (err) { if (!err.cancel) toast(tr("fail")); else openSheet(); } };
    bindPhotos(); bindGuess();
    $("#clear").onclick = () => {
      $("#clear").outerHTML = '<span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>' + esc(tr("clearAsk")) + '</b><button class="btn solid" id="yes">' + esc(tr("clearYes")) + '</button><button class="btn" id="no">' + esc(tr("clearNo")) + "</button></span>";
      $("#no").onclick = openSheet;
      $("#yes").onclick = async () => { try { await post("/api/data/clear"); toast(tr("cleared")); await refresh(); $("#sheet").classList.remove("open"); } catch (err) { if (!err.cancel) toast(tr("fail")); else openSheet(); } };
    };
  }
  $("#gear").onclick = () => S.data && openSheet();
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePol(); $("#sheet").classList.remove("open"); } });

  // ---------- start ----------
  const h0 = location.hash.slice(1) === "log" ? "moments" : location.hash.slice(1); if (VIEWS[h0]) S.tab = h0;
  applyLang();
  refresh();
  WhyConn.start();
  setInterval(refresh, 30000);
  // drafts appear while the parent looks at the page: check the to-answer list more often, redraw only when it changed
  setInterval(async () => {
    if (!S.data || document.hidden) return;
    try {
      const t = await api("/api/todo");
      if (JSON.stringify(t.items) !== JSON.stringify((S.data.todo || {}).items)) { S.data.todo = t; renderChrome(); if (S.tab === "week") render(); }
    } catch (e) {}
  }, 8000);
  window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== S.tab) go(t); });
})();
</script>
</body>
</html>
