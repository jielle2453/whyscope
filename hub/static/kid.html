<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF2FF">
<title>Whyscope</title>
<style>
  :root {
    --ink: #2B2A4A; --body: #5A5878; --cap: #6E6C8E;
    --lav: #C7B8FF; --lav-ink: #5B4AB8; --sky: #BFE0FF; --sky-ink: #2B6CB0; --peach: #FFD6C2; --peach-ink: #C2410C;
    --mint: #CBF3E3; --mint-ink: #1F7A5C; --lemon: #FFF1B8; --lemon-ink: #6B5400; --rose: #FFD1E0; --rose-ink: #B4306B;
    --glass: rgba(255,255,255,0.62); --glass-line: rgba(255,255,255,0.8); --shadow: 0 10px 30px rgba(96,80,140,0.10);
    --r: 28px; --btn: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { min-height: 100vh; min-height: 100dvh; color: var(--ink); position: relative; overflow-x: hidden;
         background: linear-gradient(170deg, #EAF2FF 0%, #F6F0FF 50%, #FFF6EC 100%) fixed;
         font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
         font-size: 14.5px; line-height: 1.5; display: flex; flex-direction: column; align-items: center;
         user-select: none; -webkit-user-select: none; }
  .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .4; pointer-events: none; z-index: 0; }
  .blob.b1 { width: 320px; height: 320px; background: #BFD9FF; top: -90px; left: -100px; }
  .blob.b2 { width: 280px; height: 280px; background: #BFD9FF; bottom: -80px; right: -90px; opacity: .3; }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
           border: 1px solid var(--glass-line); border-radius: var(--r); box-shadow: var(--shadow); }
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 640px; flex: 1; display: flex; flex-direction: column;
          padding: 0 16px 24px; }

  /* header */
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 8px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 6px 8px; border-radius: 999px; }
  header .logo { width: 36px; height: 36px; flex: none; }
  .brand .av { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--lav); display: none; place-items: center; font-size: 20px; overflow: hidden; margin-left: 2px; }
  .brand .av.on { display: grid; }
  .brand .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  .conn { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--body); padding: 8px 12px; border-radius: 999px; }
  .conn i { width: 10px; height: 10px; border-radius: 50%; background: #A9A7C2; display: inline-block; }
  .conn.ok i { background: #3DBE8B; }

  .hdr-r { display: flex; align-items: center; gap: 8px; }
  .lang { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--cap); }
  .lang button { position: relative; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 3px 9px; border-radius: 999px; min-width: 30px; }
  .lang button::after { content: ""; position: absolute; inset: -14px -2px; }
  .lang button[aria-pressed="true"] { background: var(--lav-ink); color: #fff; }
  .lang button:focus-visible { outline: 3px solid var(--lav-ink); outline-offset: 2px; }
  .lang i { font-style: normal; opacity: .5; }
  .grown { width: 36px; height: 36px; border-radius: 999px; border: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--cap); cursor: pointer; padding: 0; position: relative; }
  .grown svg { width: 18px; height: 18px; }
  .grown::after { content: ""; position: absolute; inset: 2px; border-radius: 999px; border: 2px solid var(--lav-ink); opacity: 0; transform: scale(.6); transition: transform 1.4s linear, opacity .2s; }
  .grown.pressing::after { opacity: 1; transform: scale(1); }
  .grown:focus-visible { outline: 3px solid var(--lav-ink); outline-offset: 2px; }
  @media (max-width: 440px) { #connlbl { display: none; } .conn { padding-left: 10px; padding-right: 10px; } .hdr-r { gap: 6px; } }

  /* prompt card */
  .hello { margin: 12px 0 0; padding: 22px 14px; text-align: center; font-size: 19px; font-weight: 700; display: flex; flex-direction: column; align-items: center; }
  .hello small { display: block; font-size: 14.5px; font-weight: 400; color: var(--body); margin-top: 4px; }
  body.has-answer .hello, body.has-answer .hero-art { display: none; }
  .hero-art { width: 88px; margin: 0 0 8px; }
  .wave { display: none; margin: 12px 0 0; padding: 10px 20px; align-items: center; justify-content: center; border-radius: 999px; width: 100%; }
  .wave svg { width: 100%; max-width: 280px; height: 40px; display: block; }
  .wave rect { fill: var(--lav-ink); opacity: .55; transform-box: fill-box; transform-origin: center;
               transform: scaleY(.1); transition: transform .08s linear; }
  .wave.live { display: flex; }
  .wave.live rect { transform: scaleY(calc(.12 + var(--lvl, 0) * var(--k, 1))); opacity: .85; }

  /* answer card */
  #answer { display: none; border-radius: var(--r); padding: 22px 18px; margin: 12px 0 4px; flex-direction: column; gap: 12px;
            background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
            border: 1px solid var(--glass-line); box-shadow: var(--shadow); animation: rise .24s ease-out; }
  #answer.show { display: flex; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  #answer .qline { font-size: 12.5px; color: var(--body); }
  #answer .qline:empty { display: none; }
  #emoji { width: 72px; height: 72px; border-radius: 50%; background: var(--sky); display: flex; align-items: center; justify-content: center;
           font-size: 35px; line-height: 1; }
  #emoji:empty { display: none; }
  #first { font-size: clamp(23px, 7.6vw, 30px); font-weight: 800; line-height: 1.3; color: var(--ink); }
  #expl { font-size: 18px; line-height: 1.6; color: var(--body); }
  #askwrap { background: var(--peach); border-radius: 28px; padding: 14px 18px 18px; display: none; }
  #askwrap .badge { display: inline-block; background: var(--lemon); color: var(--lemon-ink); font-weight: 800; font-size: 14.5px;
                    padding: 2px 14px; border-radius: 999px; margin-bottom: 8px; }
  #askb { color: #8F2F06; font-size: 18px; font-weight: 700; line-height: 1.5; }
  .s { opacity: 0; transition: opacity .5s ease; }
  .s.in { opacity: 1; }
  .s.speaking { background: linear-gradient(transparent 62%, rgba(199,184,255,.55) 62%); }
  .thumb { align-self: flex-start; width: 120px; height: 120px; object-fit: cover; border-radius: 24px; border: 3px solid #fff; }
  .actions { display: none; gap: 12px; margin-top: 8px; }
  .actions button { flex: 1; min-height: 72px; border-radius: 999px; border: 0; font: inherit; font-size: 16px; font-weight: 700;
                    cursor: pointer; transition: transform .12s; }
  #replay { background: var(--lav); color: #3B2F8F; }
  #another { background: var(--sky); color: #1E4E80; }
  .actions button:active, form.row button:active { transform: scale(.96); }

  /* abstained / sensitive */
  #answer.soft { background: rgba(233,243,255,0.72); }
  #answer.soft #first { font-size: clamp(21px, 6.6vw, 26px); }
  #answer .art { display: none; }
  #answer.soft .art, #answer.unsure .art { display: block; width: 120px; height: 120px; align-self: center; }
  #answer.unsure #first { text-align: center; font-size: clamp(19px, 6.2vw, 24px); font-weight: 700; }
  #answer .headline { display: none; text-align: center; font-size: 23px; font-weight: 800; }
  #answer.unsure .headline, #answer.soft .headline { display: block; }
  #answer.soft .headline { color: var(--sky-ink); }
  #answer.unsure #emoji, #answer.soft #emoji { display: none; }

  /* mic zone */
  .mic-zone { margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #talk { --disc: 176px; --core: 112px; position: relative; width: var(--disc); height: var(--disc); border-radius: 50%; border: 0; padding: 0;
          background: transparent; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
          cursor: pointer; touch-action: none; font: inherit; }
  body.has-answer #talk { --disc: 132px; --core: 88px; }
  #talk::before { content: ""; position: absolute; width: var(--core); height: var(--core); border-radius: 50%; z-index: 1;
                  background: linear-gradient(135deg, #3F82DC 0%, #7C6CFF 100%); box-shadow: 0 8px 20px rgba(96,80,140,0.18); transition: background .25s; }
  #talk .ring { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.8);
                pointer-events: none; z-index: 0; transform: scale(1); }
  #talk .ring.r2 { display: none; }
  #talk svg { width: 44px; height: 44px; position: relative; z-index: 2; }
  body.has-answer #talk svg { width: 36px; height: 36px; }
  #talk .lbl { display: none; }
  #talk.idle .ring { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.04); } }
  #talk.listening .ring { animation: none; transform: scale(calc(1 + var(--lvl, 0) * .08)); transition: transform .08s linear; }
  #talk.listening::before { background: linear-gradient(135deg, #7C6CFF, #5B4AB8); }
  #talk .dots { display: none; position: relative; z-index: 2; }
  #talk.thinking::before { background: rgba(255,255,255,0.9); }
  #talk.thinking .dots { display: block; }
  #talk.thinking svg { display: none; }
  .dots span { display: inline-block; width: 14px; height: 14px; margin: 0 4px; border-radius: 50%; background: var(--lav);
               animation: bounce .8s infinite; }
  .dots span:nth-child(2) { background: var(--sky); animation-delay: .15s; }
  .dots span:nth-child(3) { background: var(--peach); animation-delay: .3s; }
  @keyframes bounce { 50% { transform: translateY(-12px); } }
  #talklabel { font-size: 14.5px; font-weight: 700; color: var(--body); }

  form.row { display: flex; gap: 8px; width: 100%; height: 72px; padding: 8px 8px 8px 22px; align-items: center; border-radius: 999px; }
  form.row input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font: inherit; font-size: 14.5px; color: var(--ink);
                   user-select: text; -webkit-user-select: text; }
  form.row input::placeholder { color: var(--cap); }
  form.row input:focus { outline: none; }
  form.row:focus-within { border-color: var(--lav-ink); }
  form.row button { height: 56px; min-width: 96px; border: 0; border-radius: 999px; background: linear-gradient(135deg,#7C6CFF,#5B4AB8);
                    color: #fff; font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer; transition: transform .12s; }
  form.row button:disabled { opacity: .5; }

  .cam { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 14px; border-radius: 999px; font-size: 14.5px; color: var(--body); }
  .cam .ico { font-size: 19px; }
  .cam label.sw { position: relative; width: 56px; height: 34px; flex: none; cursor: pointer; }
  .cam label.sw input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; }
  .cam label.sw span { position: absolute; inset: 0; background: #D9D4EE; border-radius: 999px; transition: background .2s; }
  .cam label.sw span::after { content: ""; position: absolute; left: 4px; top: 4px; width: 26px; height: 26px; border-radius: 50%;
                              background: #fff; transition: transform .2s; box-shadow: 0 2px 6px rgba(96,80,140,0.18); }
  .cam label.sw input:checked + span { background: var(--lav-ink); }
  .cam label.sw input:checked + span::after { transform: translateX(22px); }
  .cam label.sw input:focus-visible + span { outline: 3px solid var(--lav-ink); outline-offset: 3px; }
  #preview { display: none; width: 56px; height: 56px; object-fit: cover; border-radius: 50%; margin-left: auto; background: #000; }
  #status { min-height: 22px; font-size: 12.5px; color: var(--body); text-align: center; }
  .fx { animation: rise .24s ease-out both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .s { opacity: 1; } }
</style>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div><div class="blob b2" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="brand glass fx">
      <svg class="logo" viewBox="0 0 64 64" role="img" data-i18n-aria="logo" aria-label="Whyscope logo"><circle cx="27" cy="27" r="19" fill="#E9F3FF" stroke="#5B4AB8" stroke-width="5"/><path d="M41 41l15 15" stroke="#FFB48F" stroke-width="8" stroke-linecap="round"/><path d="M21 22.5a6.5 6.5 0 1 1 9.4 5.8c-2 1-3.4 2.1-3.4 4.2" fill="none" stroke="#2B6CB0" stroke-width="4.5" stroke-linecap="round"/><circle cx="27" cy="38.5" r="2.6" fill="#2B6CB0"/></svg>
      <h1 data-i18n="brand">Whyscope</h1>
      <span class="av" id="av" aria-hidden="true"></span>
    </div>
    <div class="hdr-r">
      <div class="lang glass fx" id="lang" role="group" data-i18n-aria="langGroup" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><i aria-hidden="true">/</i><button type="button" data-lang="zh" aria-pressed="false">中</button></div>
      <div class="conn glass fx" id="conn" role="status"><i aria-hidden="true"></i><span id="connlbl">Connecting</span></div>
      <button type="button" class="grown glass fx" id="grown" data-i18n-aria="grown" aria-label="For grown-ups: hold to open the parent app" title="For grown-ups: hold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </header>

  <p class="hello glass fx" style="animation-delay:40ms">
    <svg class="hero-art" viewBox="0 0 200 175" aria-hidden="true"><circle cx="92" cy="74" r="56" fill="#E9F3FF" stroke="#5B4AB8" stroke-width="9"/><path d="M134 116l40 38" stroke="#FFB48F" stroke-width="16" stroke-linecap="round"/><path d="M70 62a22 22 0 1 1 32 19c-7 3-10 8-10 14" fill="none" stroke="#2B6CB0" stroke-width="10" stroke-linecap="round"/><circle cx="92" cy="115" r="6.5" fill="#2B6CB0"/><path d="M168 22l6-12M184 40l12-4M14 30l-8-10" stroke="#C7B8FF" stroke-width="6" stroke-linecap="round"/></svg>
    <span data-i18n="hello">Anything you wonder about?</span><small data-i18n="helloSub">Hold the round button and talk</small>
  </p>

  <section id="answer" aria-live="polite">
    <div class="qline" id="q" lang="zh-TW"></div>
    <svg class="art" id="art" viewBox="0 0 120 120" role="img" data-i18n-aria="artAsk" aria-label="Ask a grown-up together"></svg>
    <div class="headline" id="headline"></div>
    <div id="emoji" aria-hidden="true"></div>
    <div id="first" lang="zh-TW"></div>
    <div id="expl" lang="zh-TW"></div>
    <div id="askwrap"><span class="badge" data-i18n="guess">Your guess?</span><div id="askb" lang="zh-TW"></div></div>
    <div class="actions" id="actions">
      <button id="replay" type="button" data-i18n="replay">Say it again</button>
      <button id="another" type="button" data-i18n="another">New question</button>
    </div>
  </section>

  <div class="mic-zone">
    <div class="wave glass fx" id="wave" aria-hidden="true" style="animation-delay:80ms"><svg viewBox="0 0 280 40" id="waveSvg"></svg></div>
    <button id="talk" class="idle" type="button" data-i18n-aria="hold" aria-label="Hold to talk">
      <span class="ring" aria-hidden="true"></span><span class="ring r2" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg>
      <span class="lbl" aria-hidden="true"></span>
      <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <div id="talklabel">Hold to talk</div>
    <form class="row glass fx" id="form" autocomplete="off" style="animation-delay:120ms">
      <input type="text" id="text" data-i18n-ph="typeQ" data-i18n-aria="typeAria" placeholder="or type a question" aria-label="Type a question" maxlength="80">
      <button type="submit" id="send" data-i18n="ask">Ask</button>
    </form>
    <div class="cam glass fx" style="animation-delay:160ms">
      <span class="ico" aria-hidden="true">📷</span>
      <label for="cam" data-i18n="cam">Camera on, show me</label>
      <label class="sw"><input type="checkbox" id="cam" data-i18n-aria="camAria" aria-label="Camera on"><span></span></label>
      <video id="preview" autoplay playsinline muted></video>
    </div>
    <div id="status" role="status"></div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const talk = $("talk"), ans = $("answer"), statusEl = $("status");
  let stream = null, rec = null, chunks = [], recStart = 0, busy = false, camStream = null, token = 0;
  let audioCtx = null, analyser = null, levelRaf = 0, lastItems = [];

  // ---------- i18n (chrome only; answers from the knowledge base stay Chinese) ----------
  const T = {
    en: { stuck: "Oops, I got stuck. Can we try again?", title: "Whyscope", brand: "Whyscope", logo: "Whyscope logo", langGroup: "Language", artAsk: "Ask a grown-up together",
      hello: "Anything you wonder about?", helloSub: "Hold the round button and talk", guess: "Your guess?", replay: "Say it again", another: "New question",
      hold: "Hold to talk", listening: "Listening\u2026", thinking: "Thinking", typeQ: "or type a question", typeAria: "Type a question", ask: "Ask",
      cam: "Camera on, show me", camAria: "Camera on", connecting: "Connecting", connected: "Connected", offline: "Offline", grown: "For grown-ups: hold to open the parent app",
      youAsked: "You asked: ", sensitive: "Let's ask a grown-up about this", unsure: "Let's go ask a grown-up", photoAlt: "Photo just taken",
      noIdea: "I can't figure it out. Can you ask again?", failed: "Connection failed", camFail: "Can't open the camera. Please check permissions.",
      noRec: "This browser can't record. Please type your question.", needMic: "Please allow the microphone to talk.", tooShort: "Hold a bit longer, then let go when you're done." },
    zh: { stuck: "哎呀，我卡住了，再試一次好嗎？", title: "好奇鏡", brand: "好奇鏡", logo: "好奇鏡標誌", langGroup: "語言", artAsk: "一起去問大人",
      hello: "有什麼想知道的嗎？", helloSub: "按住圓圓的按鈕說話", guess: "你猜猜看", replay: "再說一次", another: "換一個問題",
      hold: "按住說話", listening: "我在聽…", thinking: "想一想", typeQ: "或是打字問我", typeAria: "輸入問題", ask: "問問題",
      cam: "開鏡頭，拍給我看", camAria: "開鏡頭", connecting: "連線中", connected: "已連線", offline: "未連線", grown: "大人用：長按回到家長頁",
      youAsked: "你問：", sensitive: "這個我們一起問大人", unsure: "我們一起去問大人", photoAlt: "剛剛拍的照片",
      noIdea: "我想不出來了，再問一次好嗎？", failed: "連線失敗", camFail: "無法開啟鏡頭，請檢查權限",
      noRec: "這個瀏覽器不能錄音，請用打字問我", needMic: "需要允許麥克風才能說話", tooShort: "按久一點，說完再放開喔" }
  };
  let LANG = null;
  try { const q = new URLSearchParams(location.search).get("lang"); if (q === "en" || q === "zh") LANG = q; } catch (e) {}
  if (!LANG) { try { LANG = localStorage.getItem("whyscope_lang"); } catch (e) {} }
  if (LANG !== "en" && LANG !== "zh") LANG = "en";
  const tr = (k) => (T[LANG][k] != null ? T[LANG][k] : T.en[k] != null ? T.en[k] : k);
  let statusKey = "", connKey = "connecting", lblKey = "hold", headKey = "", qText = "", micS = "idle";
  const setStatus = (k) => { statusKey = k || ""; statusEl.textContent = statusKey ? tr(statusKey) : ""; };
  const renderQ = () => { $("q").textContent = qText ? tr("youAsked") + qText : ""; };
  const renderHead = () => { $("headline").textContent = headKey ? tr(headKey) : ""; };
  const setLbl = (k) => { lblKey = k; $("talklabel").textContent = tr(k); };
  function applyLang() {
    document.documentElement.lang = LANG === "zh" ? "zh-TW" : "en";
    document.title = tr("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = tr(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = tr(el.dataset.i18nPh); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", tr(el.dataset.i18nAria)); });
    document.querySelectorAll("#lang [data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
    $("connlbl").textContent = tr(connKey); $("talklabel").textContent = tr(lblKey);
    statusEl.textContent = statusKey ? tr(statusKey) : ""; renderQ(); renderHead();
    talk.setAttribute("aria-label", tr(micS === "thinking" ? "thinking" : micS === "listening" ? "listening" : "hold"));
  }
  $("lang").addEventListener("click", (e) => {
    const b = e.target.closest("[data-lang]"); if (!b) return;
    LANG = b.dataset.lang;
    try { localStorage.setItem("whyscope_lang", LANG); } catch (err) {}
    try { const u = new URL(location.href); if (u.searchParams.has("lang")) { u.searchParams.set("lang", LANG); history.replaceState(null, "", u); } } catch (err) {}
    applyLang();
    fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ language: LANG }) }).catch(() => {});
  });
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  // waveform: flat bars, scaled by the mic level (--lvl) while listening
  (function () {
    const svg = $("waveSvg"), ks = [.5, .8, 1.1, .7, 1.4, .9, 1.7, 1.1, 2.0, 1.2, 1.7, .9, 1.4, .7, 1.1, .8, .5];
    svg.innerHTML = ks.map((k, i) => '<rect x="' + (12 + i * 16) + '" y="4" width="6" height="32" rx="3" style="--k:' + k + '"/>').join("");
  })();
  // grown-up exit: hold the lock for 1.4 s (a quick tap does nothing, so a child cannot wander into the parent app)
  (function () {
    const b = $("grown"); if (!b) return; let t = null;
    const start = (e) => { e.preventDefault(); b.classList.add("pressing"); t = setTimeout(() => { location.href = "/parent?lang=" + LANG; }, 1400); };
    const stop = () => { b.classList.remove("pressing"); if (t) { clearTimeout(t); t = null; } };
    b.addEventListener("pointerdown", start); ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); location.href = "/parent?lang=" + LANG; } });
  })();
  function micState(s) { micS = s; $("wave").classList.toggle("live", s === "listening"); talk.className = s; talk.setAttribute("aria-label", tr(s === "thinking" ? "thinking" : s === "listening" ? "listening" : "hold")); }

  // ---------- connection dot ----------
  async function health() {
    try { const r = await fetch("/healthz", { cache: "no-store" }); const ok = r.ok;
      $("conn").classList.toggle("ok", ok); connKey = ok ? "connected" : "offline"; $("connlbl").textContent = tr(connKey);
    } catch (e) { $("conn").classList.remove("ok"); connKey = "offline"; $("connlbl").textContent = tr(connKey); }
  }
  applyLang();
  // the avatar the parent picked (memory key `avatar`: girl | boy | emoji, default girl)
  async function loadAvatar() {
    let a = "girl";
    try { const m = await (await fetch("/api/memory", { cache: "no-store" })).json(); a = ((m.memory || {}).avatar || {}).value || "girl"; } catch (e) {}
    $("av").innerHTML = a === "emoji" ? "🧒" : '<img src="/static/avatar-' + (a === "boy" ? "boy" : "girl") + '.png" alt="" width="40" height="40">';
    $("av").classList.add("on");
  }
  loadAvatar(); document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAvatar(); });
  health(); setInterval(health, 10000);

  // ---------- speech out ----------
  let voices = [];
  function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  const PREFER = ["HsiaoChen", "HsiaoYu", "Hanhan", "Yating", "Taiwan"];
  const PREFER_EN = ["Natural", "Aria", "Jenny", "Samantha", "Google US English"];
  let ansLang = LANG;   // language of the answer on screen (comes back from the server as r.lang)
  function pickVoice() {
    const norm = (v) => v.lang.replace("_", "-").toLowerCase();
    if (ansLang === "en") {
      const en = voices.filter((v) => norm(v).startsWith("en-us") || norm(v).startsWith("en-gb") || norm(v).startsWith("en"));
      for (const p of PREFER_EN) { const v = en.find((x) => x.name.includes(p)); if (v) return v; }
      return en.find((v) => norm(v).startsWith("en-us")) || en.find((v) => norm(v).startsWith("en-gb")) || en[0] || null;
    }
    const tw = voices.filter((v) => norm(v).startsWith("zh-tw") || /taiwan|台灣/i.test(v.name));
    for (const p of PREFER) { const v = voices.find((x) => x.name.includes(p)); if (v) return v; }
    return tw[0] || voices.find((v) => norm(v).startsWith("zh")) || null;
  }
  const splitSents = (t) => (t.match(/[^。！？!?.]+[。！？!?.]?/g) || []).map((s) => s.trim()).filter(Boolean);

  // Each text block is split into sentence spans; spans are spoken one after another and fade in as they start.
  function fill(el, text) {
    el.textContent = "";
    return splitSents(text).map((s) => { const sp = document.createElement("span"); sp.className = "s"; sp.textContent = s; el.appendChild(sp); if (ansLang === "en") el.appendChild(document.createTextNode(" ")); return sp; });
  }
  let ttsBroken = false;   // set when the browser has no working voice: text then simply appears at reading pace
  function speakOne(span, text, my) {
    return new Promise((resolve) => {
      span.classList.add("in", "speaking");
      let finished = false, w1 = 0, w2 = 0, w3 = 0;
      const done = () => { if (finished) return; finished = true; clearTimeout(w1); clearTimeout(w2); clearTimeout(w3); span.classList.remove("speaking"); resolve(); };
      const readTime = Math.max(900, text.length * (ansLang === "en" ? 75 : 220));
      if (!window.speechSynthesis || ttsBroken || my !== token) { w2 = setTimeout(done, my === token ? readTime : 0); return; }
      const u = new SpeechSynthesisUtterance(text);
      if (ansLang === "en") { u.lang = "en-US"; u.rate = 0.95; u.pitch = 1.05; } else { u.lang = "zh-TW"; u.rate = 0.9; u.pitch = 1.05; }
      const v = pickVoice(); if (v) u.voice = v;
      let started = false;
      u.onstart = () => { started = true; clearTimeout(w1); };
      u.onend = u.onerror = done;
      speechSynthesis.speak(u);
      w1 = setTimeout(() => { if (!started) { ttsBroken = true; speechSynthesis.cancel(); w2 = setTimeout(done, readTime); } }, 1500);
      w3 = setTimeout(done, Math.max(6000, text.length * 700));   // never get stuck on one sentence
    });
  }
  let chain = Promise.resolve();
  function enqueue(spans) { const my = token; chain = chain.then(async () => { for (const sp of spans) { if (my !== token) { sp.classList.add("in"); continue; } await speakOne(sp, sp.textContent, my); } }); }
  function stopSpeech() { token++; if (window.speechSynthesis) speechSynthesis.cancel(); chain = Promise.resolve(); }

  // ---------- art ----------
  const ART_UNSURE = '<circle cx="60" cy="60" r="52" fill="#FFD6C2"/><path d="M44 46a16 16 0 1 1 24 14c-5 3-8 6-8 12" fill="none" stroke="#5B4AB8" stroke-width="9" stroke-linecap="round"/><circle cx="60" cy="92" r="6" fill="#FFB48F"/><path d="M92 28l5-9M100 40l9-3M25 28l-5-9" stroke="#2B6CB0" stroke-width="5" stroke-linecap="round"/>';
  const ART_SOFT = '<circle cx="60" cy="60" r="52" fill="#fff"/><path d="M60 94S26 74 26 49c0-12 9-20 19-20 7 0 12 4 15 9 3-5 8-9 15-9 10 0 19 8 19 20 0 25-34 45-34 45z" fill="#BFE0FF" stroke="#2B6CB0" stroke-width="5" stroke-linejoin="round"/>';
  const EMO = { unsure: "🧐", not_heard: "🎤" };

  // ---------- render ----------
  function resetCard() {
    ["first", "expl", "askb"].forEach((i) => { $(i).textContent = ""; });
    qText = ""; headKey = ""; renderQ(); renderHead();
    $("askwrap").style.display = "none"; $("actions").style.display = "none"; $("emoji").textContent = "";
    ans.className = "show";
  }
  function showFirst(r) {
    document.body.classList.add("has-answer");
    ansLang = r.lang === "en" || r.lang === "zh" ? r.lang : LANG;
    ["q", "first", "expl", "askb"].forEach((i) => { $(i).lang = ansLang === "en" ? "en" : "zh-TW"; });
    resetCard();
    const sensitive = r.status === "sensitive", unsure = r.status === "abstained";
    if (sensitive) { ans.className = "show soft"; $("art").innerHTML = ART_SOFT; headKey = "sensitive"; renderHead(); }
    else if (unsure && r.reason !== "not_heard" && r.reason !== "no_question") {
      ans.className = "show unsure"; $("art").innerHTML = ART_UNSURE; headKey = "unsure"; renderHead();
      qText = r.question || ""; renderQ();
    } else if (unsure) { $("emoji").textContent = EMO.not_heard; }
    else { $("emoji").textContent = r.emoji || "🔍"; qText = r.question || ""; renderQ(); }
    const sp = fill($("first"), (r.reaction || "") + (ansLang === "en" && r.reaction ? " " : "") + (r.first_sentence || ""));
    enqueue(sp);
    lastItems = [sp];
    $("actions").style.display = "flex";
    ans.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function showRest(r) {
    const a = fill($("expl"), r.explanation || ""), b = r.ask_back ? fill($("askb"), r.ask_back.replace(/^猜猜看，/, "").replace(/^Can you guess\?\s*/i, "")) : [];   // the badge already says 你猜猜看
    if (b.length) $("askwrap").style.display = "block";
    enqueue([...a, ...b]);
    lastItems = [...lastItems, a, b].flat();
  }
  $("replay").onclick = () => {
    stopSpeech();
    const spans = lastItems.flat();
    spans.forEach((s) => s.classList.remove("in", "speaking"));
    enqueue(spans);
  };
  $("another").onclick = () => {
    stopSpeech(); ans.className = ""; document.body.classList.remove("has-answer"); setStatus("");
    $("text").focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: "smooth" });
  };

  // ---------- camera ----------
  $("cam").addEventListener("change", async (e) => {
    if (!e.target.checked) { stopCam(); return; }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      $("preview").srcObject = camStream; $("preview").style.display = "block";
    } catch (err) { e.target.checked = false; setStatus("camFail"); }
  });
  function stopCam() {
    if (camStream) camStream.getTracks().forEach((t) => t.stop());
    camStream = null; $("preview").style.display = "none"; $("preview").srcObject = null;
  }
  function grabFrame() {
    return new Promise((resolve) => {
      const v = $("preview");
      if (!camStream || !v.videoWidth) return resolve(null);
      const c = document.createElement("canvas");
      const s = Math.min(1, 640 / v.videoWidth);
      c.width = v.videoWidth * s; c.height = v.videoHeight * s;
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      c.toBlob((b) => resolve(b), "image/jpeg", 0.8);
    });
  }
  // show the captured frame for 2 s, then discard it (only ever held in memory, never uploaded anywhere else)
  function flashThumb(blob) {
    const url = URL.createObjectURL(blob), t = new Image();
    t.className = "thumb"; t.alt = tr("photoAlt"); t.src = url;
    ans.insertBefore(t, $("first"));
    setTimeout(() => { t.remove(); URL.revokeObjectURL(url); }, 2000);
  }

  // ---------- ask: first sentence now, the rest by polling ----------
  async function ask(fd) {
    if (busy) return;
    busy = true; $("send").disabled = true; stopSpeech(); setStatus(""); micState("thinking");
    try {
      const img = await grabFrame();
      if (img) { fd.append("image", img, "frame.jpg"); }
      fd.append("lang", LANG);
      const res = await fetch("/api/ask", { method: "POST", body: fd });
      if (!res.ok) throw new Error(res.status);
      const r = await res.json();
      showFirst(r);
      if (img) flashThumb(img);
      if (r.pending && r.pending_id) {
        const t0 = Date.now(); let full = null;
        while (Date.now() - t0 < 8000) {
          await sleep(300);
          const pr = await fetch("/api/ask/" + r.pending_id, { cache: "no-store" });
          if (pr.status === 200) { const j = await pr.json(); if (!j.pending) { full = j; break; } }
        }
        if (full) showRest(full);
        else setStatus("noIdea");
      }
    } catch (e) {
      showFirst({ status: "abstained", reason: "not_heard", first_sentence: tr("stuck") });
      setStatus("failed");
    } finally { busy = false; $("send").disabled = false; micState("idle"); }
  }
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = $("text").value.trim();
    if (!t) return;
    const fd = new FormData(); fd.append("mode", "text"); fd.append("text", t);
    $("text").value = ""; ask(fd);
  });

  // ---------- voice (press and hold) with a live level meter ----------
  function meter() {
    if (!analyser) return;
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    let sum = 0; for (let i = 0; i < buf.length; i++) { const d = (buf[i] - 128) / 128; sum += d * d; }
    document.documentElement.style.setProperty("--lvl", Math.min(1, Math.sqrt(sum / buf.length) * 5).toFixed(2));
    levelRaf = requestAnimationFrame(meter);
  }
  function startMeter() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; src.connect(analyser); meter();
    } catch (e) { analyser = null; }
  }
  function stopMeter() { cancelAnimationFrame(levelRaf); analyser = null; document.documentElement.style.setProperty("--lvl", 0); }
  async function startRec() {
    if (busy || rec) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) { setStatus("noRec"); return; }
    try {
      if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) { setStatus("needMic"); return; }
    stopSpeech();
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
    const mt = types.find((t) => MediaRecorder.isTypeSupported(t));
    chunks = [];
    rec = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined);
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const dur = Date.now() - recStart, type = rec.mimeType || "audio/webm";
      rec = null; stopMeter(); micState("idle"); setLbl("hold");
      if (dur < 500) { setStatus("tooShort"); return; }
      const ext = type.includes("ogg") ? "ogg" : type.includes("mp4") ? "m4a" : "webm";
      const fd = new FormData(); fd.append("mode", "voice");
      fd.append("audio", new Blob(chunks, { type }), "q." + ext);
      ask(fd);
    };
    recStart = Date.now(); rec.start(); startMeter();
    micState("listening"); setLbl("listening"); setStatus("");
  }
  function stopRec() { if (rec && rec.state === "recording") rec.stop(); }
  talk.addEventListener("pointerdown", (e) => { e.preventDefault(); talk.setPointerCapture(e.pointerId); startRec(); });
  talk.addEventListener("pointerup", stopRec);
  talk.addEventListener("pointercancel", stopRec);
  talk.addEventListener("contextmenu", (e) => e.preventDefault());
  talk.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); startRec(); } });
  talk.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") stopRec(); });
})();
</script>
</body>
</html>
