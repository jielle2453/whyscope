<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<title>好奇鏡</title>
<style>
  :root { --navy: #1F2A44; --cream: #FBF8F2; --orange: #F28C28; --orange-ink: #B35A00; --sky: #2E86AB; --sky-soft: #E3F1F7;
          --card: #FFFFFF; --muted: #5B6478; --soft: #EDE7DA; --r: 24px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { min-height: 100vh; min-height: 100dvh; background: var(--cream); color: var(--navy);
         font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", system-ui, sans-serif;
         font-size: 20px; line-height: 1.45; display: flex; flex-direction: column; align-items: center;
         user-select: none; -webkit-user-select: none; }
  .wrap { width: 100%; max-width: 640px; flex: 1; display: flex; flex-direction: column; padding: 0 18px 22px; }

  /* header */
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; }
  header .logo { width: 44px; height: 44px; flex: none; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: 2px; flex: 1; }
  .conn { display: flex; align-items: center; gap: 7px; font-size: 16px; color: var(--muted); }
  .conn i { width: 12px; height: 12px; border-radius: 50%; background: #9AA3B5; display: inline-block; }
  .conn.ok i { background: #2FB66A; box-shadow: 0 0 0 4px rgba(47,182,106,.18); }

  /* greeting */
  .hello { text-align: center; font-size: 26px; font-weight: 700; margin: 10px 0 0; }
  .hello small { display: block; font-size: 18px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  body.has-answer .hello, body.has-answer .hero-art { display: none; }
  .hero-art { width: min(52vw, 220px); align-self: center; margin: 22px 0 0; }

  /* answer card */
  #answer { display: none; background: var(--card); border-radius: var(--r); padding: 20px 20px 18px; margin: 12px 0 4px;
            box-shadow: 0 6px 22px rgba(31,42,68,.10); flex-direction: column; gap: 10px; animation: rise .35s ease-out; }
  #answer.show { display: flex; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  #answer .qline { font-size: 17px; color: var(--muted); min-height: 0; }
  #answer .qline:empty { display: none; }
  #emoji { font-size: 64px; line-height: 1; }
  #first { font-size: clamp(30px, 10vw, 40px); font-weight: 800; line-height: 1.3; }
  #expl { font-size: 28px; line-height: 1.5; }
  #askwrap { background: #FFF1DF; border-radius: 18px; padding: 12px 14px 14px; display: none; }
  #askwrap .badge { display: inline-block; background: var(--orange); color: var(--navy); font-weight: 800; font-size: 17px;
                    padding: 3px 14px; border-radius: 999px; margin-bottom: 6px; }
  #askb { color: var(--orange-ink); font-size: 28px; font-weight: 700; line-height: 1.4; }
  .s { opacity: 0; transition: opacity .5s ease; }
  .s.in { opacity: 1; }
  .s.speaking { background: linear-gradient(transparent 62%, rgba(46,134,171,.28) 62%); }
  .thumb { align-self: flex-start; width: 120px; height: 120px; object-fit: cover; border-radius: 18px; border: 3px solid var(--sky); }
  .actions { display: none; gap: 10px; margin-top: 4px; }
  .actions button { flex: 1; min-height: 72px; border-radius: var(--r); border: 0; font: inherit; font-size: 21px; font-weight: 700;
                    cursor: pointer; }
  #replay { background: var(--sky); color: #fff; }
  #another { background: var(--soft); color: var(--navy); }
  .actions button:active { transform: scale(.97); }

  /* abstained / sensitive */
  #answer.soft { background: var(--sky-soft); }
  #answer.soft #first { font-size: clamp(26px, 8vw, 32px); }
  #answer .art { display: none; }
  #answer.soft .art, #answer.unsure .art { display: block; width: 120px; height: 120px; align-self: center; }
  #answer.unsure #first { text-align: center; font-size: clamp(24px, 7.5vw, 30px); font-weight: 700; }
  #answer .headline { display: none; text-align: center; font-size: 30px; font-weight: 800; }
  #answer.unsure .headline, #answer.soft .headline { display: block; }
  #answer.soft .headline { color: var(--sky); }
  #answer.unsure #emoji, #answer.soft #emoji { display: none; }

  /* mic zone */
  .mic-zone { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #talk { position: relative; width: 156px; height: 156px; border-radius: 50%; border: 0; background: var(--orange); color: var(--navy);
          display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; touch-action: none;
          box-shadow: 0 6px 16px rgba(31,42,68,.22); transition: width .25s, height .25s; font: inherit; }
  body.has-answer #talk { width: 108px; height: 108px; }
  #talk svg { width: 54px; height: 54px; position: relative; z-index: 2; }
  #talk .lbl { font-size: 18px; font-weight: 800; position: relative; z-index: 2; margin-top: 2px; }
  body.has-answer #talk .lbl { display: none; }
  #talk .ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--orange); opacity: 0; pointer-events: none; }
  #talk.idle .ring { animation: pulse 2.4s ease-out infinite; }
  #talk.idle .ring.r2 { animation-delay: 1.2s; }
  @keyframes pulse { from { opacity: .55; transform: scale(1); } to { opacity: 0; transform: scale(1.32); } }
  #talk.listening { background: #E5731A; animation: none; }
  #talk.listening .ring { animation: none; opacity: .7; transform: scale(calc(1.15 + var(--lvl, 0) * .9)); transition: transform .08s linear; }
  #talk.listening .ring.r2 { transform: scale(calc(1.05 + var(--lvl, 0) * .55)); opacity: .45; }
  #talk .dots { display: none; position: relative; z-index: 2; }
  #talk.thinking { background: var(--navy); color: var(--cream); }
  #talk.thinking .dots { display: block; }
  #talk.thinking svg, #talk.thinking .lbl { display: none; }
  .dots span { display: inline-block; width: 16px; height: 16px; margin: 0 4px; border-radius: 50%; background: var(--orange);
               animation: bounce .8s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 50% { transform: translateY(-14px); } }

  form.row { display: flex; gap: 10px; width: 100%; }
  form.row input { flex: 1; min-width: 0; height: 72px; border: 2px solid #D8D1C2; border-radius: var(--r); padding: 0 18px; font: inherit;
                   font-size: 20px; background: #fff; color: var(--navy); user-select: text; -webkit-user-select: text; }
  form.row input:focus { outline: 3px solid var(--sky); border-color: var(--sky); }
  form.row button { height: 72px; min-width: 96px; border: 0; border-radius: var(--r); background: var(--navy); color: #fff; font: inherit;
                    font-size: 20px; font-weight: 700; cursor: pointer; }
  form.row button:disabled { opacity: .5; }

  .cam { display: flex; align-items: center; gap: 12px; min-height: 72px; width: 100%; font-size: 19px; color: var(--muted); }
  .cam label.sw { position: relative; width: 72px; height: 44px; flex: none; cursor: pointer; }
  .cam label.sw input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; }
  .cam label.sw span { position: absolute; inset: 0; background: #C9C2B3; border-radius: 999px; transition: background .2s; }
  .cam label.sw span::after { content: ""; position: absolute; left: 4px; top: 4px; width: 36px; height: 36px; border-radius: 50%;
                              background: #fff; transition: transform .2s; }
  .cam label.sw input:checked + span { background: var(--sky); }
  .cam label.sw input:checked + span::after { transform: translateX(28px); }
  .cam label.sw input:focus-visible + span { outline: 3px solid var(--navy); outline-offset: 3px; }
  #preview { display: none; width: 72px; height: 72px; object-fit: cover; border-radius: 16px; margin-left: auto; background: #000; }
  #status { min-height: 22px; font-size: 15px; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .s { opacity: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="好奇鏡標誌"><circle cx="27" cy="27" r="19" fill="#E3F1F7" stroke="#1F2A44" stroke-width="5"/><path d="M41 41l15 15" stroke="#F28C28" stroke-width="8" stroke-linecap="round"/><path d="M21 22.5a6.5 6.5 0 1 1 9.4 5.8c-2 1-3.4 2.1-3.4 4.2" fill="none" stroke="#2E86AB" stroke-width="4.5" stroke-linecap="round"/><circle cx="27" cy="38.5" r="2.6" fill="#2E86AB"/></svg>
    <h1>好奇鏡</h1>
    <div class="conn" id="conn" role="status"><i aria-hidden="true"></i><span id="connlbl">連線中</span></div>
  </header>

  <p class="hello">有什麼想知道的嗎？<small>按住圓圓的按鈕說話</small></p>

  <svg class="hero-art" viewBox="0 0 200 175" aria-hidden="true"><circle cx="92" cy="74" r="56" fill="#E3F1F7" stroke="#1F2A44" stroke-width="9"/><path d="M134 116l40 38" stroke="#F28C28" stroke-width="16" stroke-linecap="round"/><path d="M70 62a22 22 0 1 1 32 19c-7 3-10 8-10 14" fill="none" stroke="#2E86AB" stroke-width="10" stroke-linecap="round"/><circle cx="92" cy="115" r="6.5" fill="#2E86AB"/><path d="M168 22l6-12M184 40l12-4M14 30l-8-10" stroke="#F28C28" stroke-width="6" stroke-linecap="round"/></svg>

  <section id="answer" aria-live="polite">
    <div class="qline" id="q"></div>
    <svg class="art" id="art" viewBox="0 0 120 120" role="img" aria-label="一起去問大人"></svg>
    <div class="headline" id="headline"></div>
    <div id="emoji" aria-hidden="true"></div>
    <div id="first"></div>
    <div id="expl"></div>
    <div id="askwrap"><span class="badge">你猜猜看</span><div id="askb"></div></div>
    <div class="actions" id="actions">
      <button id="replay" type="button">再說一次</button>
      <button id="another" type="button">換一個問題</button>
    </div>
  </section>

  <div class="mic-zone">
    <button id="talk" class="idle" type="button" aria-label="按住說話">
      <span class="ring" aria-hidden="true"></span><span class="ring r2" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg>
      <span class="lbl" id="talklabel">按住說話</span>
      <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <form class="row" id="form" autocomplete="off">
      <input type="text" id="text" placeholder="或是打字問我" aria-label="輸入問題" maxlength="80">
      <button type="submit" id="send">問問看</button>
    </form>
    <div class="cam">
      <label class="sw"><input type="checkbox" id="cam" aria-label="開鏡頭"><span></span></label>
      <label for="cam">開鏡頭，拍給我看</label>
      <video id="preview" autoplay playsinline muted></video>
    </div>
    <div id="status" role="status"></div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const talk = $("talk"), ans = $("answer"), statusEl = $("status");
  let stream = null, rec = null, chunks = [], recStart = 0, busy = false, camStream = null, token = 0;
  let audioCtx = null, analyser = null, levelRaf = 0, lastItems = [];

  const setStatus = (t) => { statusEl.textContent = t || ""; };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function micState(s) { talk.className = s; talk.setAttribute("aria-label", s === "thinking" ? "想一想" : s === "listening" ? "我在聽" : "按住說話"); }

  // ---------- connection dot ----------
  async function health() {
    try { const r = await fetch("/healthz", { cache: "no-store" }); const ok = r.ok;
      $("conn").classList.toggle("ok", ok); $("connlbl").textContent = ok ? "已連線" : "未連線";
    } catch (e) { $("conn").classList.remove("ok"); $("connlbl").textContent = "未連線"; }
  }
  health(); setInterval(health, 10000);

  // ---------- speech out ----------
  let voices = [];
  function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  const PREFER = ["HsiaoChen", "HsiaoYu", "Hanhan", "Yating", "Taiwan"];
  function pickVoice() {
    const norm = (v) => v.lang.replace("_", "-").toLowerCase();
    const tw = voices.filter((v) => norm(v).startsWith("zh-tw") || /taiwan|台灣/i.test(v.name));
    for (const p of PREFER) { const v = voices.find((x) => x.name.includes(p)); if (v) return v; }
    return tw[0] || voices.find((v) => norm(v).startsWith("zh")) || null;
  }
  const splitSents = (t) => (t.match(/[^。！？!?]+[。！？!?]?/g) || []).map((s) => s.trim()).filter(Boolean);

  // Each text block is split into sentence spans; spans are spoken one after another and fade in as they start.
  function fill(el, text) {
    el.textContent = "";
    return splitSents(text).map((s) => { const sp = document.createElement("span"); sp.className = "s"; sp.textContent = s; el.appendChild(sp); return sp; });
  }
  let ttsBroken = false;   // set when the browser has no working voice: text then simply appears at reading pace
  function speakOne(span, text, my) {
    return new Promise((resolve) => {
      span.classList.add("in", "speaking");
      let finished = false, w1 = 0, w2 = 0, w3 = 0;
      const done = () => { if (finished) return; finished = true; clearTimeout(w1); clearTimeout(w2); clearTimeout(w3); span.classList.remove("speaking"); resolve(); };
      const readTime = Math.max(900, text.length * 220);
      if (!window.speechSynthesis || ttsBroken || my !== token) { w2 = setTimeout(done, my === token ? readTime : 0); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-TW"; u.rate = 0.9; u.pitch = 1.05;
      const v = pickVoice(); if (v) u.voice = v;
      let started = false;
      u.onstart = () => { started = true; clearTimeout(w1); };
      u.onend = u.onerror = done;
      speechSynthesis.speak(u);
      w1 = setTimeout(() => { if (!started) { ttsBroken = true; speechSynthesis.cancel(); w2 = setTimeout(done, readTime); } }, 1500);
      w3 = setTimeout(done, Math.max(6000, text.length * 700));   // never get stuck on one sentence
    });
  }
  let chain = Promise.resolve();
  function enqueue(spans) { const my = token; chain = chain.then(async () => { for (const sp of spans) { if (my !== token) { sp.classList.add("in"); continue; } await speakOne(sp, sp.textContent, my); } }); }
  function stopSpeech() { token++; if (window.speechSynthesis) speechSynthesis.cancel(); chain = Promise.resolve(); }

  // ---------- art ----------
  const ART_UNSURE = '<circle cx="60" cy="60" r="52" fill="#FFF1DF"/><path d="M44 46a16 16 0 1 1 24 14c-5 3-8 6-8 12" fill="none" stroke="#1F2A44" stroke-width="9" stroke-linecap="round"/><circle cx="60" cy="92" r="6" fill="#F28C28"/><path d="M92 28l5-9M100 40l9-3M25 28l-5-9" stroke="#2E86AB" stroke-width="5" stroke-linecap="round"/>';
  const ART_SOFT = '<circle cx="60" cy="60" r="52" fill="#fff"/><path d="M60 94S26 74 26 49c0-12 9-20 19-20 7 0 12 4 15 9 3-5 8-9 15-9 10 0 19 8 19 20 0 25-34 45-34 45z" fill="#9CCBE0" stroke="#2E86AB" stroke-width="5" stroke-linejoin="round"/>';
  const EMO = { unsure: "🧐", not_heard: "🎤" };

  // ---------- render ----------
  function resetCard() {
    ["first", "expl", "askb", "q", "headline"].forEach((i) => { $(i).textContent = ""; });
    $("askwrap").style.display = "none"; $("actions").style.display = "none"; $("emoji").textContent = "";
    ans.className = "show";
  }
  function showFirst(r) {
    document.body.classList.add("has-answer");
    resetCard();
    const sensitive = r.status === "sensitive", unsure = r.status === "abstained";
    if (sensitive) { ans.className = "show soft"; $("art").innerHTML = ART_SOFT; $("headline").textContent = "這個我們一起問大人"; }
    else if (unsure && r.reason !== "not_heard" && r.reason !== "no_question") {
      ans.className = "show unsure"; $("art").innerHTML = ART_UNSURE; $("headline").textContent = "我們一起去問大人";
      $("q").textContent = r.question ? "你問：" + r.question : "";
    } else if (unsure) { $("emoji").textContent = EMO.not_heard; }
    else { $("emoji").textContent = r.emoji || "🔍"; $("q").textContent = r.question ? "你問：" + r.question : ""; }
    const sp = fill($("first"), (r.reaction || "") + (r.first_sentence || ""));
    enqueue(sp);
    lastItems = [sp];
    $("actions").style.display = "flex";
    ans.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function showRest(r) {
    const a = fill($("expl"), r.explanation || ""), b = r.ask_back ? fill($("askb"), r.ask_back.replace(/^猜猜看，/, "")) : [];   // the badge already says 你猜猜看
    if (b.length) $("askwrap").style.display = "block";
    enqueue([...a, ...b]);
    lastItems = [...lastItems, a, b].flat();
  }
  $("replay").onclick = () => {
    stopSpeech();
    const spans = lastItems.flat();
    spans.forEach((s) => s.classList.remove("in", "speaking"));
    enqueue(spans);
  };
  $("another").onclick = () => {
    stopSpeech(); ans.className = ""; document.body.classList.remove("has-answer"); setStatus("");
    $("text").focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: "smooth" });
  };

  // ---------- camera ----------
  $("cam").addEventListener("change", async (e) => {
    if (!e.target.checked) { stopCam(); return; }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      $("preview").srcObject = camStream; $("preview").style.display = "block";
    } catch (err) { e.target.checked = false; setStatus("無法開啟鏡頭，請檢查權限"); }
  });
  function stopCam() {
    if (camStream) camStream.getTracks().forEach((t) => t.stop());
    camStream = null; $("preview").style.display = "none"; $("preview").srcObject = null;
  }
  function grabFrame() {
    return new Promise((resolve) => {
      const v = $("preview");
      if (!camStream || !v.videoWidth) return resolve(null);
      const c = document.createElement("canvas");
      const s = Math.min(1, 640 / v.videoWidth);
      c.width = v.videoWidth * s; c.height = v.videoHeight * s;
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      c.toBlob((b) => resolve(b), "image/jpeg", 0.8);
    });
  }
  // show the captured frame for 2 s, then discard it (only ever held in memory, never uploaded anywhere else)
  function flashThumb(blob) {
    const url = URL.createObjectURL(blob), t = new Image();
    t.className = "thumb"; t.alt = "剛剛拍的照片"; t.src = url;
    ans.insertBefore(t, $("first"));
    setTimeout(() => { t.remove(); URL.revokeObjectURL(url); }, 2000);
  }

  // ---------- ask: first sentence now, the rest by polling ----------
  async function ask(fd) {
    if (busy) return;
    busy = true; $("send").disabled = true; stopSpeech(); setStatus(""); micState("thinking");
    try {
      const img = await grabFrame();
      if (img) { fd.append("image", img, "frame.jpg"); }
      const res = await fetch("/api/ask", { method: "POST", body: fd });
      if (!res.ok) throw new Error(res.status);
      const r = await res.json();
      showFirst(r);
      if (img) flashThumb(img);
      if (r.pending && r.pending_id) {
        const t0 = Date.now(); let full = null;
        while (Date.now() - t0 < 8000) {
          await sleep(300);
          const pr = await fetch("/api/ask/" + r.pending_id, { cache: "no-store" });
          if (pr.status === 200) { const j = await pr.json(); if (!j.pending) { full = j; break; } }
        }
        if (full) showRest(full);
        else setStatus("我想不出來了，再問一次好嗎？");
      }
    } catch (e) {
      showFirst({ status: "abstained", reason: "not_heard", first_sentence: "哎呀，我卡住了，再試一次好嗎？" });
      setStatus("連線失敗");
    } finally { busy = false; $("send").disabled = false; micState("idle"); }
  }
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = $("text").value.trim();
    if (!t) return;
    const fd = new FormData(); fd.append("mode", "text"); fd.append("text", t);
    $("text").value = ""; ask(fd);
  });

  // ---------- voice (press and hold) with a live level meter ----------
  function meter() {
    if (!analyser) return;
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    let sum = 0; for (let i = 0; i < buf.length; i++) { const d = (buf[i] - 128) / 128; sum += d * d; }
    talk.style.setProperty("--lvl", Math.min(1, Math.sqrt(sum / buf.length) * 5).toFixed(2));
    levelRaf = requestAnimationFrame(meter);
  }
  function startMeter() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; src.connect(analyser); meter();
    } catch (e) { analyser = null; }
  }
  function stopMeter() { cancelAnimationFrame(levelRaf); analyser = null; talk.style.setProperty("--lvl", 0); }
  async function startRec() {
    if (busy || rec) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) { setStatus("這個瀏覽器不能錄音，請用打字問我"); return; }
    try {
      if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) { setStatus("需要允許麥克風才能說話"); return; }
    stopSpeech();
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
    const mt = types.find((t) => MediaRecorder.isTypeSupported(t));
    chunks = [];
    rec = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined);
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const dur = Date.now() - recStart, type = rec.mimeType || "audio/webm";
      rec = null; stopMeter(); micState("idle"); $("talklabel").textContent = "按住說話";
      if (dur < 500) { setStatus("按久一點，說完再放開喔"); return; }
      const ext = type.includes("ogg") ? "ogg" : type.includes("mp4") ? "m4a" : "webm";
      const fd = new FormData(); fd.append("mode", "voice");
      fd.append("audio", new Blob(chunks, { type }), "q." + ext);
      ask(fd);
    };
    recStart = Date.now(); rec.start(); startMeter();
    micState("listening"); $("talklabel").textContent = "我在聽…"; setStatus("");
  }
  function stopRec() { if (rec && rec.state === "recording") rec.stop(); }
  talk.addEventListener("pointerdown", (e) => { e.preventDefault(); talk.setPointerCapture(e.pointerId); startRec(); });
  talk.addEventListener("pointerup", stopRec);
  talk.addEventListener("pointercancel", stopRec);
  talk.addEventListener("contextmenu", (e) => e.preventDefault());
  talk.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); startRec(); } });
  talk.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") stopRec(); });
})();
</script>
</body>
</html>
