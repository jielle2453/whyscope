<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" aria-label="Whyscope key visual: a girl and a boy looking at a snail through a big orange magnifying glass">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;family=Noto+Sans+TC:wght@900&amp;display=swap');
    .logo { font-family: 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif; font-weight: 700; }
    .zh { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; font-weight: 900; }
  </style>

  <!-- background -->
  <rect width="1600" height="900" fill="#FFD95A"/>
  <circle cx="1380" cy="120" r="150" fill="#FFE68A" opacity="0.7"/>
  <circle cx="160" cy="760" r="190" fill="#FFE68A" opacity="0.7"/>

  <!-- lettering blob -->
  <g transform="translate(800 215) rotate(-3)">
    <path d="M-470 -20 C-520 -120 -300 -150 -180 -120 C-60 -150 120 -160 260 -130 C420 -150 520 -60 470 40 C440 130 300 150 150 130 C0 160 -200 150 -330 120 C-470 110 -510 40 -470 -20 Z" fill="#5BA86B"/>
    <text class="logo" x="0" y="52" text-anchor="middle" font-size="176" fill="#FFFFFF" stroke="#2B2A4A" stroke-width="9" paint-order="stroke" stroke-linejoin="round" letter-spacing="-3">Whyscope</text>
  </g>
  <!-- chinese pill -->
  <g transform="translate(800 336)">
    <rect x="-118" y="-36" width="236" height="72" rx="36" fill="#FFFFFF" stroke="#2B2A4A" stroke-width="6"/>
    <text class="zh" x="0" y="18" text-anchor="middle" font-size="46" fill="#2B2A4A">好奇鏡</text>
  </g>

  <!-- confetti -->
  <g fill="none" stroke-linecap="round" stroke-width="10">
    <path d="M300 150 l-22 -40" stroke="#F26B3A"/>
    <path d="M345 125 l-6 -46" stroke="#F26B3A"/>
    <path d="M1255 330 l34 18" stroke="#6C8EF5"/>
    <path d="M1240 372 l38 -4" stroke="#6C8EF5"/>
    <path d="M1330 70 c20 -30 50 0 30 30 c-20 30 10 60 40 30" stroke="#F49AC2"/>
  </g>
  <g fill="#F49AC2"><path d="M420 330 l12 -34 12 34 34 10 -34 12 -12 34 -12 -34 -34 -12z"/></g>
  <g fill="#F26B3A"><path d="M1290 170 l9 -24 9 24 24 8 -24 9 -9 24 -9 -24 -24 -9z"/></g>
  <circle cx="240" cy="260" r="12" fill="#6C8EF5"/>
  <circle cx="1400" cy="300" r="12" fill="#6C8EF5"/>
  <circle cx="1180" cy="60" r="9" fill="#F49AC2"/>
  <!-- floating question marks -->
  <text class="logo" x="200" y="500" font-size="120" fill="#FFFFFF" stroke="#2B2A4A" stroke-width="7" paint-order="stroke" transform="rotate(-12 200 500)">?</text>
  <text class="logo" x="1330" y="640" font-size="96" fill="#FFFFFF" stroke="#2B2A4A" stroke-width="7" paint-order="stroke" transform="rotate(14 1330 640)">?</text>

  <!-- ===== GIRL (left) ===== -->
  <g id="girl">
    <!-- braids -->
    <g fill="#1E1B2E">
      <circle cx="372" cy="700" r="34"/><circle cx="352" cy="758" r="32"/><circle cx="338" cy="814" r="30"/><circle cx="330" cy="866" r="26"/>
      <circle cx="708" cy="700" r="34"/><circle cx="728" cy="758" r="32"/><circle cx="742" cy="814" r="30"/><circle cx="750" cy="866" r="26"/>
    </g>
    <!-- dress -->
    <path d="M400 900 L430 770 Q540 740 650 770 L680 900 Z" fill="#FFFFFF"/>
    <path d="M470 772 Q540 800 610 772 Q540 820 470 772 Z" fill="#8EC5FF"/>
    <!-- head -->
    <circle cx="540" cy="600" r="185" fill="#FFEFE4"/>
    <!-- hair cap + bangs -->
    <path d="M355 600 C355 470 440 410 540 410 C640 410 725 470 725 600 L725 560 C700 540 690 500 660 500 C640 540 600 520 560 530 C520 520 490 540 470 505 C440 505 400 540 380 560 Z" fill="#1E1B2E"/>
    <path d="M355 600 C350 520 390 440 480 418 L470 505 C440 505 400 540 380 560 Z" fill="#1E1B2E"/>
    <path d="M725 600 C730 520 690 440 600 418 L660 500 C640 540 690 540 700 560 Z" fill="#1E1B2E"/>
    <!-- happy closed eyes -->
    <path d="M455 615 q28 -30 56 0" fill="none" stroke="#1E1B2E" stroke-width="9" stroke-linecap="round"/>
    <path d="M570 615 q28 -30 56 0" fill="none" stroke="#1E1B2E" stroke-width="9" stroke-linecap="round"/>
    <!-- cheeks, nose, mouth -->
    <ellipse cx="430" cy="665" rx="34" ry="22" fill="#FFB4B4"/>
    <ellipse cx="650" cy="665" rx="34" ry="22" fill="#FFB4B4"/>
    <circle cx="540" cy="655" r="5" fill="#F4A48A"/>
    <path d="M520 690 q20 18 40 0" fill="none" stroke="#1E1B2E" stroke-width="7" stroke-linecap="round"/>
    <!-- raised arm holding handle -->
    <path d="M640 790 Q690 740 740 670" fill="none" stroke="#FFEFE4" stroke-width="44" stroke-linecap="round"/>
    <circle cx="740" cy="668" r="30" fill="#FFEFE4"/>
  </g>

  <!-- ===== BOY (right) ===== -->
  <g id="boy">
    <!-- shirt -->
    <path d="M900 900 L930 780 Q1070 740 1210 780 L1240 900 Z" fill="#3A7BD5"/>
    <rect x="928" y="800" width="60" height="22" rx="8" fill="#E8463A" transform="rotate(-18 928 800)"/>
    <rect x="1162" y="786" width="60" height="22" rx="8" fill="#E8463A" transform="rotate(18 1162 786)"/>
    <!-- head -->
    <circle cx="1070" cy="620" r="178" fill="#FFEFE4"/>
    <!-- round curly hair -->
    <path d="M892 610 C880 500 960 430 1070 430 C1180 430 1260 500 1248 610 C1232 600 1222 575 1204 582 C1192 560 1170 556 1150 568 C1138 545 1108 540 1090 560 C1070 538 1040 542 1024 566 C1004 548 980 556 968 580 C948 572 936 596 918 600 C905 596 898 604 892 610 Z" fill="#1E1B2E"/>
    <!-- dot eyes -->
    <circle cx="1008" cy="628" r="12" fill="#1E1B2E"/>
    <circle cx="1130" cy="628" r="12" fill="#1E1B2E"/>
    <!-- cheeks, mouth -->
    <ellipse cx="960" cy="680" rx="32" ry="20" fill="#FFB4B4"/>
    <ellipse cx="1180" cy="680" rx="32" ry="20" fill="#FFB4B4"/>
    <path d="M1040 700 q30 28 60 0" fill="none" stroke="#1E1B2E" stroke-width="7" stroke-linecap="round"/>
    <!-- pointing arm toward the lens -->
    <path d="M940 810 Q880 760 840 700" fill="none" stroke="#FFEFE4" stroke-width="42" stroke-linecap="round"/>
    <circle cx="838" cy="698" r="28" fill="#FFEFE4"/>
    <path d="M826 690 L790 650" stroke="#FFEFE4" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- ===== MAGNIFYING GLASS (between them) ===== -->
  <g id="lens">
    <!-- handle -->
    <path d="M740 668 L790 612" stroke="#2B2A4A" stroke-width="40" stroke-linecap="round"/>
    <!-- ring + glass -->
    <circle cx="880" cy="525" r="118" fill="#CFE6FF" opacity="0.92"/>
    <circle cx="880" cy="525" r="118" fill="none" stroke="#F26B3A" stroke-width="30"/>
    <circle cx="880" cy="525" r="118" fill="none" stroke="#2B2A4A" stroke-width="7"/>
    <circle cx="880" cy="525" r="131" fill="none" stroke="#2B2A4A" stroke-width="7"/>
    <!-- highlight -->
    <path d="M808 467 q20 -36 60 -44" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <!-- magnified snail -->
    <g transform="translate(880 537)">
      <ellipse cx="-10" cy="36" rx="78" ry="22" fill="#C9A27A"/>
      <path d="M-74 30 q-10 -40 10 -60 l8 0" fill="none" stroke="#C9A27A" stroke-width="12" stroke-linecap="round"/>
      <circle cx="-70" cy="-32" r="7" fill="#1E1B2E"/>
      <path d="M-62 36 q-6 -40 16 -56" fill="none" stroke="#C9A27A" stroke-width="12" stroke-linecap="round"/>
      <circle cx="-44" cy="-22" r="7" fill="#1E1B2E"/>
      <circle cx="18" cy="-4" r="46" fill="#F49AC2" stroke="#2B2A4A" stroke-width="6"/>
      <path d="M18 -4 m-28 0 a28 28 0 1 1 28 28 a16 16 0 1 1 16 -16" fill="none" stroke="#2B2A4A" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- tagline -->
  <text class="zh" x="24" y="868" font-size="30" fill="#2B2A4A" opacity="0.85">指著它，問為什麼。</text>
</svg>
