# Whyscope config. mode: cpu | gpu | hailo   (hailo is planned for Stage II)
mode: gpu

paths:
  db: data/whyscope.db
  knowledge: knowledge
  models: models

listen:
  model: small          # faster-whisper model size
  language: zh
  beam_size: 1
  # compute type per mode
  compute_type: {cpu: int8, gpu: float16, hailo: int8}

vision:
  enabled: true         # no-op if ultralytics/open_clip not installed
  yolo_model: yolov8n.pt
  clip_model: ViT-B-32
  clip_pretrained: laion2b_s34b_b79k
  min_confidence: 0.25

recall:
  model: paraphrase-multilingual-MiniLM-L12-v2
  threshold: 0.55

compose:
  enabled: true
  model: Qwen/Qwen2.5-1.5B-Instruct
  timeout_s: 6.0
  max_new_tokens: 120

safety:
  rules_file: knowledge/sensitive_rules.json
  cheats_dir: knowledge/cheats

retention_days: 30
cloud_fallback: false   # not available in this prototype
